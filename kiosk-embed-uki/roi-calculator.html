    // multi-CDN fallback so the "Download PDF report" button is instant.
    // jsdelivr and unpkg mirror npm exactly, so the pinned version is
    // guaranteed there; cdnjs is the final fallback.
    (function(){
      var cdns = [
        "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js",
        "https://unpkg.com/jspdf@4.2.1/dist/jspdf.umd.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"
      ];
      function tryLoad(i){
        if(i>=cdns.length||window.jspdf)return;
        var s=document.createElement("script");s.src=cdns[i];
        s.onerror=function(){tryLoad(i+1);};
        document.head.appendChild(s);
      }
      tryLoad(0);
    })();
  </script>

   React + Babel from CDN, all styles inline, images embedded as data URIs,

   - After editing, regenerate the two WordPress fragments:

/* ═══ 3. ENGINE ═══════════════════════════════════════════════════════
   Ported verbatim from the kiosk-app UKI engine (src/calc/engine.uki.js),
   which is itself a verbatim port of web/uki/roi-calculator.html's model
   — numeric parity verified. Edit assumptions here (named constants),
   never the arithmetic, unless you intend to change the model. ═══════ */
// UK & Ireland engine - ported verbatim from web/uki/roi-calculator.html
// (constants + calc()). Field names match the US engine where concepts are
// shared, plus compatibility fields (end of the return object) so the shared
// results UI renders either market. Numeric parity with the web/uki
// calculator is verified by the comparison harness (see repo history).

const RAMP5 = [0.20, 0.40, 0.60, 0.80, 1.00];

// ── Model constants ──
const STAFF_PER_BED = 2.8;
const CORPORATE_STAFF_BASE = 20;       // Base admin/corporate staff per organisation
const CORPORATE_STAFF_PER_BED = 0.12;  // Scales with size, caps at ~80 for large Trusts
const BLENDED_HOURLY_RATE = 55;
const WORKING_WEEKS = 48;
const TICKETS_PER_SYSTEM = 2.5;
const SWITCH_PENALTY_PER_SYSTEM = 0.04;  // Bartek et al JIMI 2023: 3% switch cost (beta=0.03); 4% conservative
const SURVIVING_SYSTEM_TICKET_FACTOR = 0.6;
const SAR_BASE_DAYS = 1.5;
const SAR_DAYS_PER_SYSTEM_BEFORE = 0.4;
const SAR_DAYS_PER_SYSTEM_AFTER = 0.15;

// Clinical engagement factors
const ACTIVE_USER_PCT = 0.65;           // Sinsky et al 2016; KLAS Arch Collaborative (500k+ clinicians). 65% conservative
const SYSTEM_EXPOSURE_PCT = 0.35;       // Modeled assumption: role-based access patterns
const MED_ERRORS_PER_BED = 18;          // Camacho et al, BMJ Qual Saf 2024 (10.1136/bmjqs-2023-016675): transition medication errors per 100k admissions, scaled to per-bed
const PATIENTS_HARMED_PER_BED = 0.315;  // Camacho et al 2024: patient episodes experiencing >=1 medication error at a transition, per-bed equivalent
const EXCESS_BED_DAYS_PER_BED = 0.365;  // Camacho et al 2024: excess bed days from harm due to transition errors, per-bed equivalent
// ── Quality / safety financial constants ──
const COST_PER_EXCESS_BED_DAY = 400;          // £400/day NHS Reference Costs (general acute, conservative blended)
const INDEMNITY_COST_PER_BED = 7500;          // £7,500/bed clinical negligence exposure attributable to fragmented information
                                              // Source: NHS Resolution £3.6bn settlements (NAO Oct 2025) / ~140k acute beds × 30% communication failure attribution (CRICO 2016)
const INDEMNITY_REDUCTION_PCT = 0.05;         // 5% reduction from clinical archive / consolidated EPR (conservative)
const COST_PER_DUPLICATE_TEST = 35;           // £35/test - NHS pathology blended (lab + imaging average)
const DUPLICATE_TEST_RATE = 0.18;             // 18% of tests potentially duplicate when records fragmented (Bates et al)
const TESTS_PER_BED_PER_YEAR = 22;            // NHS Reference Costs: pathology/imaging tests per bed/year baseline



const SCENARIO = {
  CONSERVATIVE: { decom_pct: 0.85, realisation: 0.20, safety: 0.15 },
  EXPECTED:     { decom_pct: 1.00, realisation: 0.30, safety: 0.25 },
  STRETCH:      { decom_pct: 1.10, realisation: 0.40, safety: 0.35 },
};
const CX = { LOW: 0.7, TYPICAL: 1.0, HIGH: 1.45 };
const DQ = { CLEAN: 0.75, MIXED: 1.0, POOR: 1.4 };

function tierCost(tier, beds, cx) {
  const base = tier === "enterprise" ? 300000 : tier === "departmental" ? 75000 : 14000;
  const perBed = tier === "enterprise" ? 700 : tier === "departmental" ? 160 : 20;
  return Math.round(((base + beds * perBed) * cx) / 1000) * 1000;
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }


function calc(inp, mode, ov = {}, flagships = []) {
  const sc = SCENARIO[mode], cx = CX[inp.complexity_level], dq = DQ[inp.data_quality_level];
  // Scenario factor overrides - allow slider on the report to drive all three scenario factors
  const realisation = (ov.realisation != null) ? ov.realisation : sc.realisation;
  const decomPct = (ov.decom_pct != null) ? ov.decom_pct : sc.decom_pct;
  const safetyPct = (ov.safety != null) ? ov.safety : sc.safety;
  const isArchiveOnly = inp.journey === "HAVE_EPR";
  const ent = ov.enterprise != null ? ov.enterprise : inp.tiers.enterprise;
  const dep = ov.departmental != null ? ov.departmental : inp.tiers.departmental;
  const nic = ov.niche != null ? ov.niche : inp.tiers.niche;
  const tieredLegacy = ent + dep + nic;
  let entCost = ov.entCost != null ? ov.entCost : tierCost("enterprise", inp.bed_count, cx);
  let depCost = ov.depCost != null ? ov.depCost : tierCost("departmental", inp.bed_count, cx);
  let nicCost = ov.nicCost != null ? ov.nicCost : tierCost("niche", inp.bed_count, cx);
  // "I know my spend" mode: distribute the stated annual spend across tiers
  // with the web calculator's 5:2:1 per-system weighting, unless explicit
  // tier-cost overrides are present. (The App has always passed _knownSpend;
  // it was previously ignored here, so the mode had no effect on results.)
  if ((inp._knownSpend || 0) > 0 && ov.entCost == null && ov.depCost == null && ov.nicCost == null) {
    const wUnits = 5 * ent + 2 * dep + 1 * nic;
    if (wUnits > 0) {
      const unit = inp._knownSpend / wUnits;
      entCost = Math.round(unit * 5); depCost = Math.round(unit * 2); nicCost = Math.round(unit);
    }
  }
  const tieredEstate = ent * entCost + dep * depCost + nic * nicCost;
  // Flagships
  const flagshipTotal = flagships.reduce((s,f) => s + (f.cost || 0), 0);
  const flagshipDecomSave = flagships.filter(f => f.retire).reduce((s,f) => s + (f.cost || 0), 0);
  const flagshipCount = flagships.length;
  const flagshipRetireCount = flagships.filter(f => f.retire).length;
  const legacy = tieredLegacy + flagshipCount;
  const totalEstate = tieredEstate + flagshipTotal;
  const blendedCost = legacy > 0 ? Math.round(totalEstate / legacy) : 0;
  const rawDecom = tieredLegacy * inp.decom_retire_rate * decomPct;
  const decom = Math.min(Math.round(rawDecom), tieredLegacy) + flagshipRetireCount;
  const decomFrac = tieredLegacy > 0 ? Math.min(Math.round(rawDecom), tieredLegacy) / tieredLegacy : 0;
  const entDecom = Math.min(Math.round(ent * decomFrac), ent);
  const depDecom = Math.min(Math.round(dep * decomFrac), dep);
  const nicDecom = clamp(Math.min(Math.round(rawDecom), tieredLegacy) - entDecom - depDecom, 0, nic);
  const decomSave = entDecom * entCost + depDecom * depCost + nicDecom * nicCost + Math.round(flagshipDecomSave * decomPct);
  const corpPerOrg = Math.min(80, Math.round(CORPORATE_STAFF_BASE + (inp.bed_count / Math.max(1, inp.org_count)) * CORPORATE_STAFF_PER_BED));
  const totalStaff = Math.round(inp.bed_count * STAFF_PER_BED + inp.org_count * corpPerOrg);
  const clinicians = ov.clinicians != null ? ov.clinicians : Math.round(totalStaff * ACTIVE_USER_PCT);
  const systemsPerUser = Math.max(2, Math.round(legacy * SYSTEM_EXPOSURE_PCT));
  const switchPenalty = Math.min(Math.max(0, systemsPerUser - 1) * SWITCH_PENALTY_PER_SYSTEM, 4.0);
  const baseMin = isArchiveOnly ? 5 : 12;
  const minsWasted = ov.minsWasted != null ? ov.minsWasted : Math.round(baseMin * dq * cx * (1 + switchPenalty));
  const residual = isArchiveOnly ? 1 : 2;
  const hrsSaved = Math.round((clinicians * Math.max(0, minsWasted - residual) * WORKING_WEEKS) / 60);
  const timeSave = Math.round(hrsSaved * BLENDED_HOURLY_RATE * realisation);
  const ticketsBaselineMonthly = ov.ticketsBaseline != null ? ov.ticketsBaseline : Math.round(legacy * TICKETS_PER_SYSTEM * dq);
  const ticketsAfter = Math.min(Math.round((legacy - decom) * TICKETS_PER_SYSTEM * dq * SURVIVING_SYSTEM_TICKET_FACTOR), ticketsBaselineMonthly);
  const ticketsReductionPct = Math.round((ticketsBaselineMonthly - ticketsAfter) / Math.max(1, ticketsBaselineMonthly) * 100);
  const sarDaysBefore = ov.sarDaysBefore != null ? ov.sarDaysBefore : Math.round((SAR_BASE_DAYS + legacy * SAR_DAYS_PER_SYSTEM_BEFORE * dq) * 10) / 10;
  const sarDaysAfter = Math.min(Math.round((SAR_BASE_DAYS + (legacy - decom) * SAR_DAYS_PER_SYSTEM_AFTER) * 10) / 10, sarDaysBefore);
  const sarReductionPct = Math.round((sarDaysBefore - sarDaysAfter) / Math.max(1, sarDaysBefore) * 100);
  const hasClinicalScope = legacy >= 3 && inp.bed_count > 0;
  let safetyMedErrorsAvoided=0, safetyPatientsProtected=0, safetyBedDaysAvoided=0, safetyMedErrorsBaseline=0, safetyPatientsHarmedBaseline=0, safetyBedDaysBaseline=0;
  if (hasClinicalScope) {
    const frag = 0.6 + Math.min(legacy, 20) / 20 * 0.6;
    safetyMedErrorsBaseline = Math.round(inp.bed_count * MED_ERRORS_PER_BED * frag * dq);
    safetyPatientsHarmedBaseline = Math.round(inp.bed_count * PATIENTS_HARMED_PER_BED * frag * dq);
    safetyBedDaysBaseline = Math.round(inp.bed_count * EXCESS_BED_DAYS_PER_BED * frag * dq);
    safetyMedErrorsAvoided = Math.round(safetyMedErrorsBaseline * safetyPct);
    safetyPatientsProtected = Math.round(safetyPatientsHarmedBaseline * safetyPct);
    safetyBedDaysAvoided = Math.round(safetyBedDaysBaseline * safetyPct);
  }
  // Quality / safety financial value (only when clinical scope present)
  let excessDayCostAvoided = 0, malpracticeReduction = 0, duplicateTestSaving = 0;
  if (hasClinicalScope) {
    excessDayCostAvoided = Math.round(safetyBedDaysAvoided * COST_PER_EXCESS_BED_DAY);
    malpracticeReduction = Math.round(inp.bed_count * INDEMNITY_COST_PER_BED * INDEMNITY_REDUCTION_PCT * safetyPct);
    duplicateTestSaving = Math.round(inp.bed_count * TESTS_PER_BED_PER_YEAR * DUPLICATE_TEST_RATE * COST_PER_DUPLICATE_TEST * safetyPct);
  }
  const qualitySavings = excessDayCostAvoided + malpracticeReduction + duplicateTestSaving;

  const annual = decomSave + timeSave + qualitySavings;
  // Phased ramp: 3yr [40,80,100] or 5yr [20,40,60,80,100]
  const rampYears = inp._rampYears || 3;
  const rampPcts = rampYears === 5 ? [0.20, 0.40, 0.60, 0.80, 1.00] : [0.40, 0.80, 1.00];
  const yrValues = rampPcts.map(p => Math.round(annual * p));
  const totalRamp = yrValues.reduce((a, b) => a + b, 0);
  // Backwards compatibility for existing references
  const y1Pct = rampPcts[0], y2Pct = rampPcts[1] || 0, y3Pct = rampPcts[2] || 0;
  const yr1 = yrValues[0], yr2 = yrValues[1] || 0, yr3 = yrValues[2] || 0;
  const total3 = totalRamp;
  return {
    legacy, ent, dep, nic, entCost, depCost, nicCost, blendedCost, totalEstate,
    decom, entDecom, depDecom, nicDecom, decomSave,
    totalStaff, clinicians, systemsPerUser, minsWasted, hrsSaved, timeSave, baseMin,
    ticketsBaselineMonthly, ticketsAfter, ticketsReductionPct,
    sarDaysBefore, sarDaysAfter, sarReductionPct,
    hasClinicalScope, safetyMedErrorsAvoided, safetyPatientsProtected,
    safetyBedDaysAvoided, safetyMedErrorsBaseline, safetyPatientsHarmedBaseline, safetyBedDaysBaseline,
    excessDayCostAvoided, malpracticeReduction, duplicateTestSaving, qualitySavings,
    annual, total3, totalRamp, rampYears, rampPcts, yrValues, yr1, yr2, yr3, y1Pct, y2Pct, y3Pct, realisation, scenarioDefaultRealisation: sc.realisation, decomFactor: decomPct, safetyFactor: safetyPct, isArchiveOnly,
    fteEquivalent: Math.round(hrsSaved * realisation / 1820 * 10) / 10,  // NHS FTE = 1820 hrs (8.4 hrs/day x 5 days x 52 weeks - leave)
    flagshipTotal, flagshipDecomSave: Math.round(flagshipDecomSave * decomPct),
    flagshipCount, flagshipRetireCount,
    // ── Compatibility fields for the shared kiosk results UI (US engine shape).
    // UKI has no reimbursement/academic/network modules; annual IS the total.
    realization: realisation,
    annualWithReimbursement: annual,
    reimbursementImpact: 0, academicSavings: 0, mergeSavings: 0, duplicateSystems: 0,
    yr1R: yrValues[0], yr2R: yrValues[1] || 0, yr3R: yrValues[2] || 0,
    total3WithReimbursement: totalRamp,
    yr5ValsR: RAMP5.map(p => Math.round(annual * p)),
    total5WithReimbursement: RAMP5.reduce((s, p) => s + Math.round(annual * p), 0),
  };
}

function InfoTip({ text }) {
  const [show, setShow] = useState(false);
  const iconRef = useRef(null);
  const [pos, setPos] = useState({ top: 0, left: 0, placeAbove: false });

  // When the tooltip opens, measure the icon's viewport position and decide
  // whether to render the bubble above or below it.
  useEffect(() => {
    if (!show || !iconRef.current) return;
    const rect = iconRef.current.getBoundingClientRect();
    const W = 400; // bubble width
    const ESTIMATED_H = 260; // bubble approx height
    const M = 14; // margin between icon and bubble
    const SAFE_TOP = 100; // header height safety margin
    const SAFE_BOTTOM = 60;

    const spaceBelow = window.innerHeight - rect.bottom - SAFE_BOTTOM;
    const spaceAbove = rect.top - SAFE_TOP;
    const placeAbove = spaceBelow < ESTIMATED_H && spaceAbove > spaceBelow;

    let top, left;
    if (placeAbove) {
      // Anchor bubble bottom to (rect.top - M), so top = rect.top - M - height.
      // We don't know height yet, so use translateY(-100%) on the bubble.
      top = rect.top - M;
    } else {
      top = rect.bottom + M;
    }
    left = rect.left + rect.width / 2 - W / 2;
    // Clamp horizontally so the bubble stays on screen
    left = Math.max(20, Math.min(left, window.innerWidth - W - 20));

    setPos({ top, left, placeAbove });
  }, [show]);

  return <span ref={iconRef} style={{ position: "relative", display: "inline-flex" }}>
    <span onClick={() => setShow(!show)} style={{ width: 28, height: 28, borderRadius: "50%", background: C.border, color: C.textMid, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: F.small, fontWeight: 700, cursor: "pointer" }}>i</span>
    {show && <>
      <div onClick={() => setShow(false)} style={{ position: "fixed", inset: 0, zIndex: 99996 }} />
      <span style={{
        position: "fixed",
        top: pos.top, left: pos.left,
        transform: pos.placeAbove ? "translateY(-100%)" : "none",
        background: C.tooltipBg, color: C.text,
        fontSize: F.small, lineHeight: 1.6, padding: "20px 24px",
        borderRadius: 16, width: 400, maxWidth: "calc(100vw - 40px)",
        boxShadow: C.tooltipShadow,
        zIndex: 99997, border: `1px solid ${C.border}`,
        animation: "kfade .2s ease-out"
      }}>{text}</span>
    </>}
  </span>;
}

// On-screen QWERTY keyboard - guaranteed to work regardless of OS/touchscreen
// keyboard configuration. Used by CustomSystemModal for the system-name input.
function OnScreenKeyboard({ value, onChange, onDone, maxLen = 40 }) {
  const [shift, setShift] = useState(true); // start uppercase for first letter
  const numRow = ['1','2','3','4','5','6','7','8','9','0'];
  const rows = shift ? [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M'],
  ] : [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['z','x','c','v','b','n','m'],
  ];
  const press = (k) => {
    if (value.length >= maxLen) return;
    onChange(value + k);
    if (shift) setShift(false);
  };
  const back = () => onChange(value.slice(0, -1));
  const space = () => { if (value.length < maxLen) onChange(value + ' '); };
  const keyStyle = (extraStyle = {}) => ({
    flex: 1, padding: '18px 0', borderRadius: 12, border: '1px solid ' + C.border,
    background: C.surface, color: C.text, fontSize: 22, fontWeight: 600,
    cursor: 'pointer', fontFamily: 'inherit', minWidth: 0, ...extraStyle
  });
  const wideStyle = (extraStyle = {}) => ({
    ...keyStyle(),
    flex: 1.6, fontSize: 16, fontWeight: 700, color: C.textMid, ...extraStyle
  });
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      <div style={{ display: 'flex', gap: 6 }}>
        {numRow.map(k => <button key={k} onClick={() => press(k)} style={keyStyle()}>{k}</button>)}
      </div>
      <div style={{ display: 'flex', gap: 6 }}>
        {rows[0].map(k => <button key={k} onClick={() => press(k)} style={keyStyle()}>{k}</button>)}
      </div>
      <div style={{ display: 'flex', gap: 6, paddingLeft: 24, paddingRight: 24 }}>
        {rows[1].map(k => <button key={k} onClick={() => press(k)} style={keyStyle()}>{k}</button>)}
      </div>
      <div style={{ display: 'flex', gap: 6 }}>
        <button onClick={() => setShift(s => !s)} style={wideStyle({ background: shift ? C.accent + '30' : C.surface, color: shift ? C.accent : C.textMid, borderColor: shift ? C.accent : C.border })}>⇧ Shift</button>
        {rows[2].map(k => <button key={k} onClick={() => press(k)} style={keyStyle()}>{k}</button>)}
        <button onClick={back} style={wideStyle()}>⌫</button>
      </div>
      <div style={{ display: 'flex', gap: 6 }}>
        <button onClick={() => press('-')} style={keyStyle({ flex: 0.6 })}>-</button>
        <button onClick={() => press('.')} style={keyStyle({ flex: 0.6 })}>.</button>
        <button onClick={space} style={keyStyle({ flex: 4, color: C.textMuted })}>space</button>
        <button onClick={() => press('/')} style={keyStyle({ flex: 0.6 })}>/</button>
        <button onClick={onDone} style={keyStyle({ flex: 1.4, background: C.accent, color: C.onAccent, borderColor: C.accent, fontWeight: 800 })}>Done</button>
      </div>
    </div>
  );
}

// Modal for adding a custom (not-in-list) legacy system. Includes on-screen keyboard
// and cost slider scoped to the tier.
function CustomSystemModal({ tier, color, onAdd, onCancel }) {
  const range = TIER_COST_RANGE[tier];
  const [name, setName] = useState('');
  const [cost, setCost] = useState(range.default);
  const handleAdd = () => {
    const trimmed = name.trim();
    if (!trimmed) return;
    onAdd({ label: trimmed, cost });
  };
  return (
    <div style={{ position: 'fixed', inset: 0, background: C.scrim, zIndex: 99998, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: 24, overflow: 'auto' }}>
      <div style={{ background: C.surface, padding: '28px 32px', borderRadius: 24, border: '1px solid ' + C.border, width: '100%', maxWidth: 920, marginTop: 60 }}>
        <div style={{ fontSize: 12, fontWeight: 700, color, letterSpacing: 3, textTransform: 'uppercase', marginBottom: 8 }}>{range.label}</div>
        <div style={{ fontSize: 24, fontWeight: 800, color: C.text, marginBottom: 4 }}>Add a system not in the list</div>
        <div style={{ fontSize: F.tiny, color: C.textMuted, marginBottom: 20 }}>Type the system name, then set its annual cost.</div>

        {/* Name display + on-screen keyboard */}
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: C.textMuted, letterSpacing: 1.5, textTransform: 'uppercase', marginBottom: 6 }}>System name</div>
          <div style={{ minHeight: 60, padding: '14px 18px', background: C.bg, border: '2px solid ' + (name ? color : C.border), borderRadius: 12, fontSize: 22, fontWeight: 600, color: name ? C.text : C.textMuted, marginBottom: 12 }}>
            {name || <span style={{ opacity: 0.5 }}>Tap keys below to type...</span>}
            {name && <span style={{ display: 'inline-block', width: 2, height: 22, background: color, marginLeft: 2, verticalAlign: 'middle', animation: 'caret-blink 1s infinite' }} />}
          </div>
          <style>{'@keyframes caret-blink { 50% { opacity: 0; } }'}</style>
          <OnScreenKeyboard value={name} onChange={setName} onDone={handleAdd} maxLen={40} />
        </div>

        {/* Cost slider */}
        <div style={{ marginTop: 20, marginBottom: 20, padding: '18px 20px', background: C.bg, borderRadius: 14 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: C.textMid }}>Annual cost</span>
            <span style={{ fontSize: 30, fontWeight: 800, color }}>{fmtK(cost)}/yr</span>
          </div>
          <input type="range" min={range.min} max={range.max} step={range.step} value={cost}
            onChange={e => setCost(Number(e.target.value))}
            style={{ width: '100%', accentColor: color, cursor: 'pointer', height: 36 }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: C.textMuted, marginTop: 4 }}>
            <span>{fmtK(range.min)}</span>
            <span>{fmtK(range.max)}</span>
          </div>
        </div>

        {/* Action buttons */}
        <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
          <button onClick={onCancel} style={{ padding: '14px 28px', borderRadius: 12, border: '1px solid ' + C.border, background: 'transparent', color: C.textMid, fontSize: 16, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Cancel</button>
          <button onClick={handleAdd} disabled={!name.trim()} style={{ padding: '14px 36px', borderRadius: 12, border: 'none', background: name.trim() ? color : C.border, color: name.trim() ? C.inkOnColor : C.textMuted, fontSize: 16, fontWeight: 800, cursor: name.trim() ? 'pointer' : 'default', fontFamily: 'inherit' }}>Add system</button>
        </div>
      </div>
    </div>
  );
}

/* ── STEP 1: organisation type (scope) ─────────────────────────────────── */
function OrgTypeStep({ orgType, onSelect }) {
  return <div>
    <SectionTitle number="1">What type of organisation are you?</SectionTitle>
    <BigChoice options={ORG_TYPES.map(o => ({
      key: o.key, label: PRESETS[o.key].label, desc: PRESETS[o.key].desc, iconKey: o.iconKey,
    }))} value={orgType} onChange={onSelect} />
  </div>;
}

/* ── STEP 2: EPR journey ───────────────────────────────────────────────── */
function JourneyStep({ journey, onSelect }) {
  return <div>
    <SectionTitle number="2">Where are you on your EPR journey?</SectionTitle>
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {[
        { key: "HAVE_EPR", label: "We want to decommission systems", desc: "You have (or are keeping) your EPR. Retire and archive the legacy estate around it.", iconKey: "check", focus: "Archiving + decommission savings" },
        { key: "EVALUATING", label: "We're evaluating enterprise EPRs", desc: "Assessing migration to a single EPR platform. Need the full case for migration and archiving.", iconKey: "search", focus: "Migration safety + archiving savings" },
      ].map(j => <button key={j.key} onClick={() => onSelect(j.key)} style={{
        padding: "clamp(18px, 2.6vw, 26px)", textAlign: "left", cursor: "pointer",
        border: journey === j.key ? `2px solid ${C.accent}` : `1px solid ${C.border}`,
        borderRadius: 16, background: journey === j.key ? C.accentPale : C.surface, transition: "all .2s"
      }}>
        <div style={{ marginBottom: 12 }}><Icon name={j.iconKey} size={36} stroke={journey === j.key ? C.accent : C.textMid} /></div>
        <div style={{ fontSize: F.h3, fontWeight: 700, color: journey === j.key ? C.accent : C.text, marginBottom: 8 }}>{j.label}</div>
        <div style={{ fontSize: F.body, color: C.textMuted, lineHeight: 1.6, marginBottom: 12 }}>{j.desc}</div>
        <div style={{ fontSize: F.small, fontWeight: 600, color: journey === j.key ? C.accent : C.textMid, padding: "6px 14px", background: journey === j.key ? C.accent + "15" : C.bg, borderRadius: 8, display: "inline-block" }}>{j.focus}</div>
      </button>)}
    </div>
  </div>;
}

/* ── STEP 3: organisation scale ────────────────────────────────────────── */
function ScaleStep({ inputs, update }) {
  const avg = Math.round(inputs.bed_count / Math.max(1, inputs.org_count));
  return <div>
    <SectionTitle number="3">Organisation scale</SectionTitle>
    <Card>
      <Stepper label="Trusts / organisations in scope" value={inputs.org_count} min={1} max={10}
        onChange={v => update("org_count", v)}
        tip="A single Trust, or the number of organisations in a multi-Trust or ICS-wide programme." />
      <TouchSlider label="Total acute beds" value={inputs.bed_count} min={50} max={Math.max(8000, inputs.bed_count + 500)} step={10}
        onChange={v => update("bed_count", v)} format={fmtNum}
        tip="Bed count is the primary scaling factor: it drives staffing levels, clinical time at risk, and harm exposure." />
      {inputs.org_count > 1 && <div style={{ fontSize: F.small, color: C.textMuted, background: C.bg, padding: "10px 14px", borderRadius: 10 }}>
        Average: {fmtNum(avg)} beds per organisation
      </div>}
    </Card>
  </div>;
}

/* ── STEP 4: legacy systems ────────────────────────────────────────────── */
function SystemsStep({ inputs, updateTier, flagships, addFlagship, removeFlagship, updateFlagshipCost, updateFlagshipInstances, costMode, setCostMode, knownSpend, setKnownSpend }) {
  const [openTier, setOpenTier] = useState(null);
  const [selected, setSelected] = useState([]);
  const [customTier, setCustomTier] = useState(null); // when set, modal is open for that tier
  const tiers = [
    { key: "enterprise", label: "Enterprise", color: C.accent, hint: "Including legacy EPR / PAS", max: Math.max(10, inputs.tiers.enterprise + 3) },
    { key: "departmental", label: "Departmental", color: C.blue, hint: "Including LIMS, PACS, pharmacy, maternity, theatres, e-obs", max: Math.max(30, inputs.tiers.departmental + 5) },
    { key: "niche", label: "Standalone", color: C.purple, hint: "Including document stores, ECM, scanned notes, rostering", max: Math.max(100, inputs.tiers.niche + 10) },
  ];
  const sliderTotal = inputs.tiers.enterprise + inputs.tiers.departmental + inputs.tiers.niche;
  // Count each flagship by its instances (default 1) so the totals reflect
  // multi-instance entries like 'Epic × 3' as 3 systems, not 1.
  const flagshipInstanceCount = flagships.reduce((s, f) => s + (f.instances || 1), 0);
  const total = sliderTotal + flagshipInstanceCount;

  return <div>
    <SectionTitle number="4">Legacy systems</SectionTitle>

    {/* Cost mode toggle */}
    <div style={{ marginBottom: 20 }}>
      <SegmentedControl value={costMode} onChange={setCostMode} options={[
        { key: "estimate", label: "Estimate costs" }, { key: "known", label: "I know my spend" },
      ]} />
    </div>

    {costMode === "known" && <Card style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <span style={{ fontSize: F.body, fontWeight: 600, color: C.textMid }}>Total annual legacy system spend</span>
        <span style={{ fontSize: F.h2, fontWeight: 800, color: C.accent }}>{fmtK(knownSpend)}/yr</span>
      </div>
      <input type="range" min={0} max={20000000} step={100000} value={knownSpend}
        onChange={e => setKnownSpend(Number(e.target.value))}
        style={{ width: "100%", cursor: "pointer", accentColor: C.accent }} />
      <div style={{ display: "flex", justifyContent: "center", gap: 12, marginTop: 8 }}>
        <button onClick={() => setKnownSpend(Math.max(0, knownSpend - 100000))} style={{ width: 48, height: 48, borderRadius: 12, border: "1px solid " + C.border, background: C.surface, color: C.textMid, fontSize: 22, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
        <div style={{ fontSize: F.tiny, color: C.textMuted, display: "flex", alignItems: "center" }}>±£100k</div>
        <button onClick={() => setKnownSpend(Math.min(20000000, knownSpend + 100000))} style={{ width: 48, height: 48, borderRadius: 12, border: "1px solid " + C.border, background: C.surface, color: C.textMid, fontSize: 22, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
      </div>
      {knownSpend > 0 && <div style={{ fontSize: F.small, color: C.textMuted, marginTop: 8, textAlign: "center" }}>
        {total} systems · {fmtK(Math.round(knownSpend / Math.max(1, total)))}/system avg
      </div>}
    </Card>}

    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {tiers.map(t => {
        const tierSystems = KNOWN_SYSTEMS.filter(s => (TIER_TYPES[t.key] || []).includes(s.type));
        const tierFlagships = flagships.filter(f => f.tier === t.key);
        return <Card key={t.key} style={{ border: `1px solid ${t.color}30` }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
            <div>
              <span style={{ fontSize: F.h3, fontWeight: 700, color: t.color }}>{t.label}</span>
              <div style={{ fontSize: F.tiny, color: C.textMuted, marginTop: 2 }}>{t.hint}</div>
            </div>
            <span style={{ fontSize: 36, fontWeight: 800, color: t.color }}>{inputs.tiers[t.key]}</span>
          </div>
          <input type="range" min={0} max={t.max} step={1} value={inputs.tiers[t.key]}
            onChange={e => updateTier(t.key, Number(e.target.value))}
            style={{ width: "100%", cursor: "pointer", accentColor: t.color }} />
          {tierFlagships.length > 0 && <div style={{ marginTop: 8 }}>
            <div style={{ fontSize: F.tiny, fontWeight: 600, color: C.textMuted, marginBottom: 6 }}>In addition to the {inputs.tiers[t.key]} above:</div>
            {tierFlagships.map((f, fi) => {
              const fIdx = flagships.indexOf(f);
              const step = f.cost > 500000 ? 50000 : f.cost > 100000 ? 25000 : 10000;
              const instances = f.instances || 1;
              const hasMultiple = instances > 1;
              return <div key={fi} style={{ background: C.bg, borderRadius: 12, marginBottom: 6 }}>
                {/* Main row: name, cost adjuster, multi-instance checkbox, remove */}
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 12px" }}>
                  <span style={{ fontSize: F.tiny, fontWeight: 600, color: t.color, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</span>
                  <button onClick={() => updateFlagshipCost(fIdx, f.cost - step)} style={{ width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.border}`, background: C.surface, color: C.textMid, fontSize: 20, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "inherit", flexShrink: 0 }}>−</button>
                  <span style={{ fontSize: F.small, fontWeight: 700, color: t.color, minWidth: 70, textAlign: "center" }}>{fmtK(f.cost)}</span>
                  <button onClick={() => updateFlagshipCost(fIdx, f.cost + step)} style={{ width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.border}`, background: C.surface, color: C.textMid, fontSize: 20, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "inherit", flexShrink: 0 }}>+</button>
                  <span style={{ fontSize: F.tiny, color: C.textMuted, flexShrink: 0 }}>/yr each</span>
                  {/* Multiple instances toggle. Checking it bumps instances 1→2 as a sensible
                      default (multi-Trust programmes typically have 2+ duplicates); unchecking returns to 1. */}
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: F.tiny, color: hasMultiple ? t.color : C.textMuted, cursor: "pointer", padding: "6px 10px", borderRadius: 8, border: `1px solid ${hasMultiple ? t.color : C.borderLight}`, background: hasMultiple ? t.color + "12" : 'transparent', flexShrink: 0, fontWeight: 600 }}>
                    <input
                      type="checkbox"
                      checked={hasMultiple}
                      onChange={e => updateFlagshipInstances(fIdx, e.target.checked ? 2 : 1)}
                      style={{ width: 16, height: 16, accentColor: t.color, cursor: "pointer" }}
                    />
                    Multiple
                  </label>
                  <button onClick={() => removeFlagship(fIdx)} style={{ width: 36, height: 36, border: "none", background: "none", color: C.textMuted, cursor: "pointer", fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>×</button>
                </div>
                {/* Instance counter row — only shown when 'Multiple' is checked.
                    Lets the user dial in 2, 3, 4 instances (e.g. an ICS with several Trusts
                    each running their own PAS). Shows the multiplied total alongside. */}
                {hasMultiple && (
                  <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "0 12px 10px 12px", borderTop: `1px dashed ${C.borderLight}`, paddingTop: 10, marginTop: 2 }}>
                    <span style={{ fontSize: F.tiny, fontWeight: 600, color: C.textMuted, flex: 1 }}>Number of instances across your network:</span>
                    <button onClick={() => updateFlagshipInstances(fIdx, instances - 1)} style={{ width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.border}`, background: C.surface, color: C.textMid, fontSize: 20, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "inherit", flexShrink: 0 }}>−</button>
                    <span style={{ fontSize: F.small, fontWeight: 800, color: t.color, minWidth: 36, textAlign: "center" }}>{instances}</span>
                    <button onClick={() => updateFlagshipInstances(fIdx, instances + 1)} style={{ width: 40, height: 40, borderRadius: 10, border: `1px solid ${C.border}`, background: C.surface, color: C.textMid, fontSize: 20, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "inherit", flexShrink: 0 }}>+</button>
                    <span style={{ fontSize: F.tiny, color: C.textMid, flexShrink: 0, marginLeft: 8 }}>= <strong style={{ color: t.color }}>{fmtK(f.cost * instances)}/yr</strong> total</span>
                  </div>
                )}
              </div>;
            })}
          </div>}
          {/* Two parallel ways to add a specific system: pick from common list, OR enter custom.
              Both buttons are always visible (when collapsed) so users can discover either path. */}
          <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
            {tierSystems.length > 0 && <div onClick={() => { setOpenTier(openTier === t.key ? null : t.key); setSelected([]); }} style={{ flex: 1, padding: "12px 16px", textAlign: "center", fontSize: F.tiny, color: C.accent, cursor: "pointer", fontWeight: 600, border: `1px solid ${C.border}`, borderRadius: 12, background: openTier === t.key ? C.accent + "10" : C.bg }}>
              {openTier === t.key ? "▾" : "▸"} Pick from common systems
            </div>}
            <button onClick={() => setCustomTier(t.key)} style={{
              flex: 1, padding: "12px 16px", borderRadius: 12,
              border: `1px dashed ${t.color}`, background: 'transparent',
              color: t.color, fontSize: F.tiny, fontWeight: 600, cursor: "pointer",
              fontFamily: "inherit"
            }}>+ Enter your own system</button>
          </div>
          {tierSystems.length > 0 && openTier === t.key && <div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 12 }}>
              {tierSystems.filter(sys => !tierFlagships.some(f => f.name === sys.label)).map(sys => {
                const isSel = selected.some(s => s.label === sys.label);
                return <button key={sys.label} onClick={() => setSelected(p => isSel ? p.filter(s => s.label !== sys.label) : [...p, sys])} style={{
                  padding: "8px 14px", fontSize: F.tiny, fontWeight: 600, borderRadius: 10, cursor: "pointer", fontFamily: "inherit", transition: "all .15s",
                  border: isSel ? `2px solid ${t.color}` : `1px solid ${C.borderLight}`,
                  background: isSel ? t.color + "18" : C.bg,
                  color: isSel ? t.color : C.textMid,
                }}>
                  {isSel ? "✓ " : ""}{sys.label} <span style={{ color: C.textMuted }}>({fmtK(systemCost(sys, inputs.bed_count))})</span>
                </button>;
              })}
            </div>
            {selected.length > 0 && <button onClick={() => { selected.forEach(sys => addFlagship(sys, t.key)); setSelected([]); setOpenTier(null); }} style={{
              marginTop: 10, padding: "14px 32px", borderRadius: 14, border: "none",
              background: t.color, color: C.inkOnColor, fontSize: F.small, fontWeight: 700,
              cursor: "pointer", fontFamily: "inherit", width: "100%"
            }}>Add {selected.length} system{selected.length > 1 ? "s" : ""}</button>}
          </div>}
        </Card>;
      })}
    </div>
    <div style={{ marginTop: 16, padding: "20px 24px", background: C.surface, borderRadius: 18, border: `1px solid ${C.border}`, display: "flex", alignItems: "center", gap: 14 }}>
      <span style={{ fontSize: 48, fontWeight: 800, color: C.accent }}>{total}</span>
      <div>
        <div style={{ fontSize: F.h3, fontWeight: 600, color: C.textMid }}>total legacy systems</div>
        {flagships.length > 0 && <div style={{ fontSize: F.tiny, color: C.textMuted, marginTop: 2 }}>{sliderTotal} by tier + {flagshipInstanceCount} named system{flagshipInstanceCount > 1 ? "s" : ""}{flagships.some(f => (f.instances || 1) > 1) ? ` (${flagships.length} entries, with multiple instances)` : ""}</div>}
      </div>
    </div>
    {customTier && (() => {
      const tier = tiers.find(t => t.key === customTier);
      return <CustomSystemModal
        tier={customTier}
        color={tier.color}
        onAdd={(sys) => { addFlagship(sys, customTier); setCustomTier(null); setOpenTier(null); }}
        onCancel={() => setCustomTier(null)}
      />;
    })()}
  </div>;
}

/* ── STEP 5: fine-tune ─────────────────────────────────────────────────── */
function FineTuneStep({ inputs, update, galenMigrationCost, setGalenMigrationCost, galenAnnualCost, setGalenAnnualCost }) {
  return <div>
    <SectionTitle number="5">Fine-tune your model</SectionTitle>
    <Card>
      <div style={{ display: "flex", gap: 20, flexWrap: "wrap", marginBottom: 28 }}>
        <div style={{ flex: "1 1 240px" }}>
          <SegmentedControl label="System complexity" info="How tightly your legacy systems are interwoven with workflows, interfaces, and customizations. Low: mostly standalone systems with simple data structures, straightforward to migrate. Typical: standard interfaces with some customization, the most common situation. High: heavily customized integrations and complex workflows that need careful migration planning. Affects per-system migration cost (High adds ~45%, Low subtracts ~30% from baseline)." value={inputs.complexity_level} onChange={v => update("complexity_level", v)}
            options={[{ key: "LOW", label: "Low" }, { key: "TYPICAL", label: "Typical" }, { key: "HIGH", label: "High" }]} />
        </div>
        <div style={{ flex: "1 1 240px" }}>
          <SegmentedControl label="Data quality" info="Cleanliness and consistency of the data in your legacy systems. Clean: well-structured, validated, with clear ownership. Mixed: typical real-world data with some duplicates, missing fields, and legacy quirks (most common). Poor: significant duplicates, inconsistent formats, missing metadata, requires substantial cleanup before migration. Affects migration effort (Poor adds ~40%, Clean subtracts ~25% from baseline)." value={inputs.data_quality_level} onChange={v => update("data_quality_level", v)}
            options={[{ key: "CLEAN", label: "Clean" }, { key: "MIXED", label: "Mixed" }, { key: "POOR", label: "Poor" }]} />
        </div>
      </div>
      <TouchSlider label="Decommission target" value={inputs.decom_retire_rate} min={0} max={1} step={0.05} onChange={v => update("decom_retire_rate", v)} format={v => `${Math.round(v * 100)}%`} tip="What % of legacy systems will be retired?" />
    </Card>
    <Card style={{ marginTop: 16 }}>
      <div style={{ fontSize: F.body, fontWeight: 700, color: C.textMid, marginBottom: 16 }}>Galen Clinical Archive costs <span style={{ fontWeight: 400, color: C.textMuted }}>(optional)</span></div>
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <span style={{ fontSize: F.small, fontWeight: 600, color: C.textMuted }}>Migration (one-time)</span>
          <span style={{ fontSize: F.h2, fontWeight: 800, color: C.accent }}>{fmtK(galenMigrationCost)}</span>
        </div>
        <input type="range" min={0} max={20000000} step={25000} value={galenMigrationCost}
          onChange={e => setGalenMigrationCost(Number(e.target.value))}
          style={{ width: "100%", cursor: "pointer", accentColor: C.accent }} />
        <div style={{ display: "flex", justifyContent: "center", gap: 12, marginTop: 8 }}>

// Resolve the jsPDF constructor. The head of this file starts pre-loading
// jsPDF 4.2.1 from a CDN list (jsdelivr → unpkg → cdnjs); this helper waits
// for / retries that load so the button works even if the pre-load raced.
function loadJsPDF() {
  return new Promise((resolve, reject) => {
    if (window.jspdf) return resolve(window.jspdf.jsPDF);
    const cdns = [
      "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js",
      "https://unpkg.com/jspdf@4.2.1/dist/jspdf.umd.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js",
    ];
    const load = (src) => new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = src;
      s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
    const tryCdn = (i) => {
      if (window.jspdf) return resolve(window.jspdf.jsPDF);
      if (i >= cdns.length) return reject(new Error("Could not load PDF library from any CDN. Check network or Content Security Policy."));
      load(cdns[i])
        .then(() => { if (window.jspdf) resolve(window.jspdf.jsPDF); else tryCdn(i + 1); })
        .catch(() => tryCdn(i + 1));
    };
    tryCdn(0);
  });
}

// Rasterise the embedded white RLDatix wordmark as a PNG data URL for jsPDF (best-effort).
async function logoDataUrl() {
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = RLDATIX_LOGO; });
    // Downscale before embedding: jsPDF stores PNGs as raw pixels, so the
    // full-size asset would bloat the file by megabytes.
    const w = 400, h = Math.round(w * img.height / img.width);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(img, 0, 0, w, h);
    return cv.toDataURL("image/png");
  } catch (e) { return null; }
}

/* One-page PDF summary (jsPDF). Same layout family as the Smart Match web
   report: navy header with the white RLDatix wordmark top-right, two headline
   callout boxes, a KPI row, confidence scenarios, Your inputs + savings
   composition side by side, the worked-out equation strip, About these
   figures, and the disclaimer. RLDatix light palette. */
async function generatePDF(r, lead, ctx) {
  const jsPDF = await loadJsPDF();
  const doc = new jsPDF({ unit: "mm", format: "a4", compress: true });
  const NAVY = [15, 65, 70], TEAL = [26, 138, 122], SEAFOAM = [52, 222, 194],
        PALE = [238, 247, 242], PALE_SEA = [232, 250, 246], BORDER = [212, 224, 221],
        TEXT = [15, 65, 70], MID = [61, 90, 94], MUTED = [120, 130, 150];
  const M = 14, W = 210 - 2 * M;
  // jsPDF's built-in helvetica maps the £ glyph fine in WinAnsi, so a plain
  // string works.
  const usd = n => "£" + Math.round(n || 0).toLocaleString("en-GB");
  const PROVIDERS = PROVIDER_LABELS;
  const total = r.annualWithReimbursement || r.annual || 0;

  // ── Header band ──
  doc.setFillColor(...NAVY); doc.rect(0, 0, 210, 34, "F");
  doc.setFillColor(...SEAFOAM); doc.rect(0, 34, 210, 1.4, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(17);
  doc.text("Galen Clinical Archive: ROI Estimate", M, 16);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...SEAFOAM);
  doc.text("RLDatix · UK & Ireland · " + new Date().toLocaleDateString("en-GB") + (lead.org ? " · " + lead.org : ""), M, 24);
  const logo = await logoDataUrl();
  if (logo) { try { doc.addImage(logo, "PNG", 210 - M - 38, 9, 38, 7.3); } catch (e) { /* header still fine without it */ } }

  // ── Headline callouts ──
  let y = 42;
  doc.setTextColor(...MUTED); doc.setFont("helvetica", "bold"); doc.setFontSize(8.5);
  doc.text("YOUR ESTIMATED ANNUAL IMPACT", M, y); y += 3;
  const hbW = (W - 4) / 2, hbH = 28;
  const headlineBox = (x, big, label, sub) => {
    doc.setFillColor(...PALE_SEA); doc.setDrawColor(...TEAL);
    doc.roundedRect(x, y, hbW, hbH, 2.5, 2.5, "FD");
    doc.setTextColor(...TEAL); doc.setFont("helvetica", "bold"); doc.setFontSize(21);
    doc.text(big, x + hbW / 2, y + 13, { align: "center" });
    doc.setTextColor(...TEXT); doc.setFontSize(9.5);
    doc.text(label, x + hbW / 2, y + 20, { align: "center" });
    doc.setTextColor(...MID); doc.setFont("helvetica", "normal"); doc.setFontSize(7.5);
    doc.text(sub, x + hbW / 2, y + 24.5, { align: "center" });
  };
  headlineBox(M, usd(total), "Potential annual savings", "at steady state, all categories combined");
  headlineBox(M + hbW + 4, `${r.decom || 0} of ${r.legacy || 0}`, "legacy systems retired", "decommissioned and archived into Galen");
  y += hbH + 6;

  // ── KPI row ──
  const kW = (W - 9) / 4, kH = 21;
  const kpis = [
    ["DECOMMISSION SAVINGS", usd(r.decomSave), "licensing, support and infrastructure retired"],
    ["CLINICAL CAPACITY", (r.fteEquivalent || 0) + " FTE", usd(r.timeSave) + "/yr clinician time value"],
    ["PATIENT SAFETY", usd(r.qualitySavings), "cost avoidance from harm prevented"],
    ["SAR TURNAROUND", (r.sarReductionPct || 0) + "% faster", (r.sarDaysBefore || 0) + " days to " + (r.sarDaysAfter || 0) + " days per subject access request"],
  ];
  kpis.forEach(([label, val, sub], i) => {
    const x = M + i * (kW + 3);
    doc.setFillColor(255, 255, 255); doc.setDrawColor(...BORDER);
    doc.roundedRect(x, y, kW, kH, 2, 2, "FD");
    doc.setTextColor(...MUTED); doc.setFont("helvetica", "bold"); doc.setFontSize(6.3);
    doc.text(label, x + 3, y + 5);
    doc.setTextColor(...NAVY); doc.setFontSize(12.5);
    doc.text(String(val), x + 3, y + 11.5);
    doc.setTextColor(...MID); doc.setFont("helvetica", "normal"); doc.setFontSize(6.2);
    doc.text(doc.splitTextToSize(sub, kW - 6), x + 3, y + 15.5);
  });
  y += kH + 7;

  // ── Confidence scenarios: every level modeled, the user's on-screen
  //    selection flagged. Each tile recomputes the whole model at that
  //    confidence level; the tile matching the user's current selection
  //    reuses `r` so the PDF matches the screen exactly. ──
  let scenarios = null;
  const activeMode = ctx.scenarioMode || "EXPECTED";
  if (ctx.calcInputs) {
    try {
      scenarios = [
        ["Conservative", "85% decom · 20% capacity · 15% safety capture", activeMode === "CONSERVATIVE" ? r : calc(ctx.calcInputs, "CONSERVATIVE", {}, ctx.flagships || [])],
        ["Moderate", "100% decom · 30% capacity · 25% safety capture", activeMode === "EXPECTED" ? r : calc(ctx.calcInputs, "EXPECTED", {}, ctx.flagships || [])],
        ["Optimistic", "110% decom · 40% capacity · 35% safety capture", activeMode === "STRETCH" ? r : calc(ctx.calcInputs, "STRETCH", {}, ctx.flagships || [])],
      ];
    } catch (e) { scenarios = null; }
  }
  const activeLabel = activeMode === "CONSERVATIVE" ? "Conservative" : activeMode === "STRETCH" ? "Optimistic" : "Moderate";
  if (scenarios) {
    doc.setTextColor(...MUTED); doc.setFont("helvetica", "bold"); doc.setFontSize(8.5);
    doc.text("SAVING BY CONFIDENCE LEVEL", M, y); y += 3;
    const sW = (W - 8) / 3, sH = 44;
    scenarios.forEach(([key, factors, rr], i) => {
      const x = M + i * (sW + 4);
      const selected = key === activeLabel;
      if (selected) { doc.setFillColor(...PALE_SEA); doc.setDrawColor(...TEAL); doc.setLineWidth(0.7); }
      else { doc.setFillColor(255, 255, 255); doc.setDrawColor(...BORDER); doc.setLineWidth(0.2); }
      doc.roundedRect(x, y, sW, sH, 2.5, 2.5, "FD");
      doc.setLineWidth(0.2);
      doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(9.5);
      doc.text(key, x + 4, y + 8);
      doc.setTextColor(...MID); doc.setFont("helvetica", "normal"); doc.setFontSize(5.8);
      doc.text(factors, x + 4, y + 12);
      if (selected) {
        doc.setFillColor(...TEAL); doc.roundedRect(x + sW - 29, y + 3.5, 25, 5.5, 2.75, 2.75, "F");
        doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(6);
        doc.text("YOUR ESTIMATE", x + sW - 16.5, y + 7.2, { align: "center" });
      }
      doc.setTextColor(...TEAL); doc.setFont("helvetica", "bold"); doc.setFontSize(13.5);
      doc.text(usd(rr.annualWithReimbursement), x + 4, y + 19.5);
      doc.setTextColor(...MID); doc.setFont("helvetica", "normal"); doc.setFontSize(6.5);
      doc.text("per year at steady state", x + 4, y + 23.5);
      doc.setDrawColor(...BORDER); doc.setLineWidth(0.2); doc.line(x + 4, y + 25.5, x + sW - 4, y + 25.5);
      const stats = [
        ["Decommission", fmtK(rr.decomSave)],
        ["Clinical capacity", fmtK(rr.timeSave)],
        ["Patient safety", fmtK(rr.qualitySavings)],
      ];
      let sy = y + 29.5;
      stats.forEach(([k2, v2]) => {
        doc.setFont("helvetica", "normal"); doc.setFontSize(6.8); doc.setTextColor(...MID);
        doc.text(k2, x + 4, sy);
        doc.setFont("helvetica", "bold"); doc.setTextColor(...NAVY);
        doc.text(String(v2), x + sW - 4, sy, { align: "right" });
        sy += 4.1;
      });
    });
    y += sH + 4;
  }

  // ── Ramp summary (compressed to one strip so the page stays a one-pager) ──
  doc.setTextColor(...MID); doc.setFont("helvetica", "bold"); doc.setFontSize(8);
  doc.text(`Adoption ramp: Year 1 ${usd(r.yr1R)} (40%)  ·  Year 2 ${usd(r.yr2R)} (80%)  ·  Year 3 ${usd(r.yr3R)} (100%)`, M, y); y += 4.5;
  doc.setFont("helvetica", "normal"); doc.setTextColor(...MUTED); doc.setFontSize(7.5);
  doc.text(`3-year total: ${usd(r.total3WithReimbursement)}   ·   5-year total (20/40/60/80/100% ramp): ${usd(r.total5WithReimbursement)}`, M, y);
  y += 6;

  // ── Two columns: Your inputs | Where the savings come from ──
  const colW = (W - 4) / 2, colH = 42;
  const colBox = (x, title, rows, note) => {
    doc.setFillColor(...PALE); doc.setDrawColor(...BORDER);
    doc.roundedRect(x, y, colW, colH, 2.5, 2.5, "FD");
    doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(9.5);
    doc.text(title, x + 4, y + 7);
    let ry = y + 13;
    doc.setFontSize(8);
    rows.forEach(([k, v]) => {
      doc.setTextColor(...MID); doc.setFont("helvetica", "normal");
      doc.text(k, x + 4, ry);
      doc.setTextColor(...TEXT); doc.setFont("helvetica", "bold");
      doc.text(String(v), x + colW - 4, ry, { align: "right" });
      ry += 5.1;
    });
    if (note) { doc.setTextColor(...MUTED); doc.setFont("helvetica", "italic"); doc.setFontSize(6.5); doc.text(note, x + 4, y + colH - 3.5); }
  };
  colBox(M, "Your inputs", [
    ["Organisation type", PROVIDERS[ctx.orgType] || ctx.orgType || "-"],
    ["Total acute beds", fmtNum(ctx.beds || 0)],
    ["Trusts / organisations", fmtNum(ctx.orgs || 1)],
    ["EPR journey", ctx.journey === "HAVE_EPR" ? "Archive-only (EPR live)" : "Migrating to a new EPR"],
    ["Legacy systems in scope", fmtNum(r.legacy || 0)],
  ]);
  const comp = [
    ["Legacy decommission", fmtK(r.decomSave)],
    ["Clinical capacity", fmtK(r.timeSave)],
  ];
  if ((r.qualitySavings || 0) > 0) comp.push(["Patient safety", fmtK(r.qualitySavings)]);
  while (comp.length < 5) comp.push(["", ""]);
  colBox(M + colW + 4, "Where the savings come from", comp.slice(0, 5),
    "Patient safety is cost avoidance - harm that does not occur.");
  y += colH + 5;

  // ── How the total is built ──
  doc.setFillColor(...PALE_SEA); doc.setDrawColor(...TEAL);
  doc.roundedRect(M, y, W, 20, 2.5, 2.5, "FD");
  doc.setTextColor(...NAVY); doc.setFont("helvetica", "bold"); doc.setFontSize(9.5);
  doc.text("How the annual total is built", M + 4, y + 7);
  doc.setFontSize(8); doc.setFont("helvetica", "normal"); doc.setTextColor(...MID);
  doc.text(`${usd(r.decomSave)} decommission  +  ${usd(r.timeSave)} capacity  +  ${usd(r.qualitySavings)} safety`, M + 4, y + 12.5);
  doc.setFont("helvetica", "bold"); doc.setTextColor(...TEAL);
  doc.text(`=  ${usd(total)} per year at steady state`, M + 4, y + 17.5);
  y += 20 + 6;

  // ── About these figures ──
  doc.setDrawColor(...BORDER); doc.setLineWidth(0.2); doc.line(M, y, M + W, y); y += 5;
  doc.setTextColor(...MUTED); doc.setFont("helvetica", "bold"); doc.setFontSize(8);
  doc.text("ABOUT THESE FIGURES", M, y); y += 5;
  const explain = [
    ["System costs", "per-system estimates by tier (enterprise / departmental / standalone), scaled by bed count and complexity. Calibrated against the contract register of a large acute NHS Trust (~1,385 beds, 42 legacy systems, 2024/25)."],
    ["Clinical capacity", "clinician time freed by eliminating context-switching across legacy systems, valued at a £55/hr blended NHS Agenda for Change rate with a conservative realisation factor. Sources: Bartek et al JIMI 2023 (2.78M EHR audit-log events), Nuffield Trust 2020."],
    ["Patient safety", "cost avoidance from transition medication errors: excess bed days at £400/day (NHS Reference Costs), clinical negligence indemnity reduction (NHS Resolution / NAO Oct 2025), duplicate testing avoided. Source: Camacho et al 2024, BMJ Quality & Safety."],
  ];
  doc.setFontSize(7.5);
  explain.forEach(([term, def]) => {
    const label = term + ": ";
    doc.setFont("helvetica", "bold"); doc.setTextColor(...NAVY);
    doc.text(label, M, y);
    const lw = doc.getTextWidth(label);
    doc.setFont("helvetica", "normal"); doc.setTextColor(...MID);
    const lines = doc.splitTextToSize(def, W - lw);
    doc.text(lines, M + lw, y);
    y += lines.length * 3.3 + 1.3;
  });
  y += 2;

  // ── Disclaimer ──
  doc.setDrawColor(...BORDER); doc.setLineWidth(0.2); doc.line(M, y, M + W, y); y += 4.5;
  doc.setFont("helvetica", "bold"); doc.setFontSize(6.8); doc.setTextColor(...MUTED);
  doc.text("DISCLAIMER", M, y); y += 3.6;
  doc.setFont("helvetica", "italic"); doc.setFontSize(6.8); doc.setTextColor(...MUTED);
  doc.text(doc.splitTextToSize("Indicative only, not a quote or a guarantee. Figures are modelled estimates with improvement rates attributed to system consolidation as a contributing factor, not sole cause. Validate against your organisation's own application inventory, contracts and funding mix before use in a business case.", W), M, y);

  const orgSlug = lead.org ? "-" + lead.org.trim().replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "") : "";
  doc.save("galen-roi-estimate-uki" + orgSlug + ".pdf");
}

function LeadCapture({ r, leadContext }) {
  const [lead, setLead] = useState({ name: "", email: "", org: "", role: "" });
  const [sending, setSending] = useState(false);
  const [submitted, setSubmitted] = useState(false);

  // Light fields on the deep-teal card: near-white so they read as inputs.
  const inputStyle = {
    flex: "1 1 200px", minWidth: 150, padding: "11px 14px", borderRadius: 999,
    border: "1px solid rgba(255,255,255,0.45)", background: "rgba(255,255,255,0.92)",
    color: "#0F4146", fontSize: F.small, outline: "none", fontFamily: "inherit",
  };

  const submitLead = useCallback(async () => {
    if (!lead.name || !lead.email || sending) return;
    setSending(true);

    const ctx = leadContext || {};
    const providerLabel = PROVIDER_LABELS[ctx.orgType] || ctx.orgType || "";

    // 1. Generate + download the PDF summary (the value exchange).
    try { await generatePDF(r, lead, ctx); } catch (e) { console.warn("PDF failed:", e); }

    // 2. Local backup (reviewable at #admin-leads; survives blocked networks).
    saveSubmission({
      timestamp: new Date().toISOString(),
      lead: { name: lead.name, email: lead.email, org: lead.org, role: lead.role },
      inputs: { orgType: ctx.orgType, beds: ctx.beds, orgs: ctx.orgs, journey: ctx.journey, scenarioMode: ctx.scenarioMode },
      results: {
        annualSavings: r.annualWithReimbursement || r.annual || 0,
        legacySystems: r.legacy || 0,
        systemsRetired: r.decom || 0,
        fteFreed: r.fteEquivalent || 0,
        patientsProtected: r.safetyPatientsProtected || 0,
      },
    });

    // 3. Fire-and-forget to HubSpot, context in the message field.
    if (HUBSPOT_PORTAL_ID && HUBSPOT_FORM_GUID) {
      try {
        const context = `Galen Clinical Archive ROI (UKI embed) submission | Organisation: ${providerLabel} | Beds: ${fmtNum(ctx.beds || 0)} | Legacy systems: ${r.legacy || 0} (${r.decom || 0} retired) | Est. annual savings: ${fmtK(r.annualWithReimbursement || r.annual || 0)} | FTE freed: ${r.fteEquivalent || 0}`;
        await fetch(`https://forms-${HUBSPOT_REGION}.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${HUBSPOT_FORM_GUID}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fields: [
              { name: "firstname", value: lead.name.split(" ")[0] },
              { name: "lastname", value: lead.name.split(" ").slice(1).join(" ") || "" },
              { name: "email", value: lead.email },
              { name: "company", value: lead.org || "" },
              { name: "jobtitle", value: lead.role || "" },
              { name: "message", value: context },
            ],
            context: { pageUri: window.location.href, pageName: "Galen Clinical Archive ROI Calculator (UKI embed)" },
            legalConsentOptions: { consent: { consentToProcess: true, text: "I agree to receive communications about my ROI estimate." } },
          }),
        });
      } catch (e) { console.warn("HubSpot submission failed:", e); }
    }

    setSending(false);
    setSubmitted(true);
  }, [lead, sending, r, leadContext]);

  if (submitted) {
    return <div style={{ marginBottom: 28, padding: "26px 28px", borderRadius: 18, background: "linear-gradient(135deg, #0F4146 0%, #1A5459 100%)", textAlign: "center" }}>

/**
 * Animates a numeric value to a target over `duration` ms with ease-out cubic.
 *
 * Two behaviours rolled into one:
 *   - First render with target X: animates 0 -> X (dramatic intro count-up,
 *     used by the hero when the report first appears).
 *   - Subsequent target changes (e.g. user taps a different timescale on
 *     the toggle): animates from the CURRENT displayed value to the new
 *     target, rolling smoothly up or down rather than resetting to 0.
 *
 * The valRef tracks the latest animated value across renders so we know
 * where to start the next animation from.
 */
function useCountUp(target, duration = 1200) {
  const [val, setVal] = useState(0);
  const valRef = useRef(0);

  useEffect(() => {
    if (target == null) return;
    const from = valRef.current;
    const startTime = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - startTime) / duration);
      const ease = 1 - Math.pow(1 - t, 3);
      const next = Math.round(from + (target - from) * ease);
      setVal(next);
      valRef.current = next;
      if (t < 1) requestAnimationFrame(tick);
      else { setVal(target); valRef.current = target; }
    };
    requestAnimationFrame(tick);
  }, [target, duration]);

  return { val };
}

function AnimK({ value }) {
  const { val } = useCountUp(value, 1200);
  return <span style={{ display: "inline-block" }}>{fmtK(val)}</span>;
}

/**
 * Generic animated value renderer. Useful when the number is wrapped in
 * surrounding text (e.g. 'X FTE freed' or 'X patients protected') and the
 * raw fmtK formatter doesn't fit. Pass any format function: receives the
 * animated value, returns the displayed string.
 */
function AnimVal({ value, format }) {
  const { val } = useCountUp(value, 1200);
  return <span style={{ display: "inline-block" }}>{format ? format(val) : val}</span>;
}

function ResultsPage({ r, galenMigrationCost, galenAnnualCost, viewTimescale, setViewTimescale, onAdjust, onStartOver, leadContext }) {

  // it stays visible during scroll).
  const TS_MULT = { year1: 0.40, total3: 2.20, total5: 3.00, annual: 1.00 };
  const TS_SUFFIX = { year1: " (Year 1)", total3: " (3-yr)", total5: " (5-yr)", annual: "/yr" };
  const TS_LABEL = { year1: "Year 1", total3: "3-yr total", total5: "5-yr total", annual: "Annual avg" };
  const ts = { mult: TS_MULT[viewTimescale], suffix: TS_SUFFIX[viewTimescale], label: TS_LABEL[viewTimescale] };
  // Helper to scale a /yr value to the current timescale. The suffix
  // ('/yr', '(3-yr)', etc) is NOT appended here — every figure on the page
  // reacts to the toggle bar at the top, and repeating '(3-yr)' on each
  // tile, row, and segment would be redundant noise. The toggle is the
  // single source of timeframe context.
  const fmtKts = (v) => fmtK(Math.round((v || 0) * ts.mult));
  // Kept as an alias for callsites that already used it (KPI tiles).
  const fmtKs = fmtKts;
  // Derived projection window for the time-series chart + Galen ROI box.

                    {segments.map((s, si) => <div key={s.key}

                      style={{ flex: s.val, background: s.color, minHeight: 2, cursor: "pointer", position: "relative", opacity: tappedBar && tappedBar !== yi+"-"+si ? 0.4 : 1, transition: "opacity .2s",
                        borderRadius: si === 0 ? "10px 10px 0 0" : si === segments.length - 1 ? "0 0 4px 4px" : 0, overflow: "visible" }}>
                      {tappedBar === yi+"-"+si && <div style={{
                        position: "absolute", bottom: "calc(100% + 6px)", left: "50%", transform: "translateX(-50%)",
                        padding: "8px 14px", background: "#222", borderRadius: 10, whiteSpace: "nowrap", zIndex: 20,
                        fontSize: 12, fontWeight: 700, color: "#fff", boxShadow: "0 4px 16px rgba(0,0,0,0.5)",
                        pointerEvents: "none"
                      }}>{s.key}: {fmtK(Math.round(s.val * y.pct))}</div>}
                    </div>)}
                  </div>
                  <div style={{ fontSize: F.tiny, color: C.textMuted, marginTop: 6, fontWeight: 600 }}>{y.yr}</div>
                </div>;
              })}
            </div>
            {tappedBar && <div style={{ textAlign: "center", marginTop: 8, fontSize: F.tiny, color: C.textMuted }}>Tap again to dismiss · tap another segment to compare</div>}
            <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap", marginTop: 12 }}>
              {segments.map(s => <div key={s.key} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <div style={{ width: 8, height: 8, borderRadius: 2, background: s.color }} />
                <span style={{ fontSize: 10, color: C.textMuted }}>{s.key}</span>
              </div>)}
            </div>
          </div>;
        })()}

        <Methodology
          formula={"steady_state_annual × ramp_percent[year]"}
          plug={projYears === 5
            ? `Year 1: ${fmtK(totalAnnual)} × 20% = ${fmtK(Math.round(totalAnnual * 0.20))}\nYear 2: ${fmtK(totalAnnual)} × 40% = ${fmtK(Math.round(totalAnnual * 0.40))}\nYear 3: ${fmtK(totalAnnual)} × 60% = ${fmtK(Math.round(totalAnnual * 0.60))}\nYear 4: ${fmtK(totalAnnual)} × 80% = ${fmtK(Math.round(totalAnnual * 0.80))}\nYear 5: ${fmtK(totalAnnual)} × 100% = ${fmtK(totalAnnual)}`
            : `Year 1: ${fmtK(totalAnnual)} × 40% = ${fmtK(Math.round(totalAnnual * 0.40))}\nYear 2: ${fmtK(totalAnnual)} × 80% = ${fmtK(Math.round(totalAnnual * 0.80))}\nYear 3: ${fmtK(totalAnnual)} × 100% = ${fmtK(totalAnnual)}`}
          source={"Phased ramp reflects progressive legacy system retirement. Data is migrated and interfaces decommissioned over time. Year 1 captures early-phase savings as the highest-cost systems are retired first; later years reach steady state once all targeted systems are fully retired."}
        />
      </Card>
    </div>

    {/* Detail sections in a 2-column grid below the stacked bar chart.
        Cards stretch to equal height per row thanks to height: 100%. */}
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18, marginBottom: 18 }}>

    {/* Decommission */}
    <div ref={decomRef}>
      <Card style={{ height: '100%', borderLeft: `3px solid ${C.accent}` }}>
        <CTitle iconKey="unlock" color={C.accent}>Decommission savings</CTitle>
        <div style={{ fontSize: F.tiny, color: C.textMid, marginBottom: 14, lineHeight: 1.5 }}>Annual licensing, support, and infrastructure costs eliminated when legacy systems are retired and data archived into Galen.</div>
        <Row label="Legacy systems in scope" value={r.legacy} />
        <Row label="Systems retired" value={r.decom} />
        <Row label="Total estate cost" value={fmtKts(r.totalEstate)} />
        <Row label={viewTimescale === 'annual' ? "Annual savings from retirement" : "Savings from retirement"} value={fmtKts(r.decomSave)} accent />
        <Methodology
          formula={"Σ (tier_count × tier_cost) × decom_rate × scenario.decom + retired_flagships × scenario.decom"}
          plug={`${r.entDecom} enterprise × ${fmtK(r.entCost)} + ${r.depDecom} departmental × ${fmtK(r.depCost)} + ${r.nicDecom} standalone × ${fmtK(r.nicCost)}\n${r.flagshipRetireCount > 0 ? `+ ${r.flagshipRetireCount} retired flagship${r.flagshipRetireCount === 1 ? "" : "s"} × scenario.decom (${Math.round((r.decomFactor||1) * 100)}%)` : ""}\n= ${fmtK(r.decomSave)}/yr (${Math.round(r.decom / Math.max(1, r.legacy) * 100)}% of ${r.legacy} systems retired)`}
          source={"Tier costs use bed-scaled annual benchmarks: Enterprise (£300k base + £700/bed), Departmental (£75k + £160/bed), Standalone (£14k + £20/bed), scaled by estate complexity. Calibrated against the contract register of a large acute NHS Trust (~1,385 beds, 42 legacy systems, 2024/25 data) — defaults cover ~80% of actual estate value."}
        />
      </Card>
    </div>

    {/* Capacity */}
    <div ref={capacityRef}>
      <Card style={{ height: '100%', borderLeft: `3px solid ${C.amber}` }}>
        <CTitle iconKey="clock" color={C.amber}>Clinical capacity</CTitle>
        <div style={{ fontSize: F.tiny, color: C.textMid, marginBottom: 14, lineHeight: 1.5 }}>Clinician time freed by eliminating context-switching between legacy systems, valued at blended hourly rate with conservative realisation.</div>
        <Row label="Total staff" value={fmtNum(r.totalStaff)} />
        <Row label="Active system users (65%)" value={fmtNum(r.clinicians)} />
        <Row label="Systems per user (~35% exposure)" value={r.systemsPerUser} />
        <Row label="Time wasted per person/week" value={`${r.minsWasted} mins`} />
        <Row label="Hours freed" value={fmtNum(Math.round(r.hrsSaved * ts.mult))} />
        <Row label="Full-time equivalent (FTE)" value={fmtFte(fte)} accent />
        <Row label="Capacity value" value={fmtKts(seg.capacity)} accent />
        <Methodology
          formula={"clinicians × (mins/wk - residual) × 48 working_weeks / 60 × £55 × scenario.realisation"}
          plug={`${fmtNum(r.clinicians)} active clinicians × ${Math.max(0, r.minsWasted - (r.isArchiveOnly ? 1 : 2))} reducible mins/wk (${r.minsWasted} - ${r.isArchiveOnly ? 1 : 2} residual) × 48 working wks / 60\n= ${fmtNum(r.hrsSaved)} hrs × £55/hr × ${Math.round((r.realization || 0.3) * 100)}% realisation\n= ${fmtK(r.timeSave)}/yr`}
          source={"Active clinicians = total staff (beds × 2.8, NHS Digital workforce statistics 2023/24) × 65% active rate (Sinsky et al 2016, KLAS Arch Collaborative 500k+ clinicians). Each clinician touches ~35% of legacy estate (role-based access, modelled). Switch penalty 4% per system: Bartek et al JIMI 2023 (PRIMARY: 2.78M EHR audit-log events, β=0.03), corroborated by Westbrook et al JAMIA 2010 and Nuffield Trust 2020. £55/hr blended: NHS Agenda for Change mid-band including on-costs, weighted towards nursing. Realisation rate: NHS Productive Ward reported 20-40%."}
        />
      </Card>
    </div>

    {/* Patient safety */}
    <div ref={safetyRef}>
      <Card style={{ height: '100%', borderLeft: `3px solid ${C.purple}` }}>
        <CTitle iconKey="shield" color={C.purple}>Patient safety impact</CTitle>
        <div style={{ fontSize: F.tiny, color: C.textMid, marginBottom: 14, lineHeight: 1.5 }}>Cost avoidance from preventing adverse events attributable to fragmented clinical information across legacy systems.</div>
        <Row label="Medication errors avoided" value={fmtNum(Math.round(r.safetyMedErrorsAvoided * ts.mult))} />
        <Row label="Patients protected from harm" value={fmtNum(Math.round(r.safetyPatientsProtected * ts.mult))} />
        <Row label="Excess bed days avoided" value={fmtNum(Math.round(r.safetyBedDaysAvoided * ts.mult))} />
        {r.malpracticeReduction > 0 && <Row label="Clinical negligence indemnity reduction" value={fmtKts(r.malpracticeReduction)} />}
        {(r.duplicateTestSaving || 0) > 0 && <Row label="Duplicate testing avoided" value={fmtKts(r.duplicateTestSaving)} />}
        {(r.qualitySavings || 0) > 0 && <Row label="Total cost avoidance" value={fmtKts(r.qualitySavings)} accent />}
        <Methodology
          formula={"Excess bed days × £400/day + Indemnity (beds × £7,500 × 5%) × scenario.safety + Duplicate tests avoided × £35"}
          plug={`Excess bed days: ${fmtNum(r.safetyBedDaysAvoided || 0)} days × £400 = ${fmtK(r.excessDayCostAvoided || 0)}/yr\n${r.malpracticeReduction > 0 ? `Indemnity: beds × £7,500 exposure × 5% reduction × scenario.safety = ${fmtK(r.malpracticeReduction)}/yr\n` : ""}${(r.duplicateTestSaving || 0) > 0 ? `Duplicate tests: beds × 22 tests/yr × 18% duplicate rate × £35 × scenario.safety = ${fmtK(r.duplicateTestSaving)}/yr\n` : ""}= ${fmtK(r.qualitySavings || 0)}/yr total`}
          source={"Harm rates: Camacho et al 2024 (BMJ Quality & Safety) — ~1.8M medication errors at care transitions across NHS England annually, 31,500 patients harmed, 36,500 excess bed days. Excess bed day cost: £400/day (NHS Reference Costs, general acute, conservative blended). Indemnity: NHS Resolution £3.6bn annual settlements (NAO Oct 2025) with 30% communication-failure attribution (CRICO 2016). Duplicate testing: Bates et al (18% duplicate rate when records fragmented), £35/test NHS pathology blended. Classification: cost avoidance — harm that doesn't occur, not direct budget reductions."}

    </div>

    </div>

    {/* Galen */}
    {hasGalen && <div style={{ marginBottom: 24, padding: "clamp(18px, 3vw, 30px)", borderRadius: 18, background: `linear-gradient(135deg, ${C.accentPale}, ${C.surface})`, border: `1px solid ${C.accent}30` }}>

        <Met label="Clinical archive annual cost" value={fmtK(galenAnnualCost) + "/yr"} />
        <Met label="Payback period" value={payback.toFixed(1) + " yrs"} />
        <Met label={projYears + "-year return"} value={(() => {
          const yr3 = r.yr3R || r.yr3 || 0;
          const totalSav = projYears === 5
            ? (r.total3WithReimbursement || r.total3 || 0) + yr3 + yr3
            : (r.total3WithReimbursement || r.total3 || 0);
          const totalCost = galenMigrationCost + galenAnnualCost * projYears;
          return Math.round((totalSav - totalCost) / Math.max(1, totalCost) * 100) + "% ROI";
        })()} />

      <div style={{ marginTop: 16, padding: "12px 16px", background: C.bg, borderRadius: 12, fontSize: F.tiny, color: C.textMuted, lineHeight: 1.6 }}>
        Payback = migration cost ÷ (annual decom savings minus annual archive cost). The {fmtK(r.decomSave)}/yr in decommission savings is only unlocked when legacy systems are safely retired. Galen enables this by providing continued access to historical data.
      </div>
    </div>}

    {/* Operational efficiency — full width (the UKI model has no
        e-discovery/cyber module, so there is no Legal card beside it). */}
    <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 18, marginBottom: 18 }}>

          <div style={{ fontSize: F.tiny, color: C.textMuted, marginBottom: 4 }}>Service desk tickets</div>
          <div style={{ fontSize: F.h2, fontWeight: 800, color: "#2ecc71" }}>{r.ticketsReductionPct}%</div>
          <div style={{ fontSize: F.tiny, color: C.textMuted }}>reduction</div>
          <div style={{ fontSize: F.tiny, color: C.textMid, marginTop: 8 }}>{r.ticketsBaselineMonthly}/mo → {r.ticketsAfter}/mo</div>
        </div>
        <div style={{ flex: 1, padding: "18px 20px", background: C.bg, borderRadius: 16, textAlign: "center" }}>
          <div style={{ fontSize: F.tiny, color: C.textMuted, marginBottom: 4 }}>SAR turnaround</div>
          <div style={{ fontSize: F.h2, fontWeight: 800, color: "#2ecc71" }}>{r.sarReductionPct}%</div>
