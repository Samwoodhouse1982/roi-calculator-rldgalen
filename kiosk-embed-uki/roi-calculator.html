        </div>
      </div>
      <Methodology
        formula={"Tickets/mo: legacy × 2.5 × dq_factor (before) vs surviving × 2.5 × 60% (after). SAR: 1.5 base + 0.4/system (before) vs 0.15/surviving (after)"}
        plug={`Tickets baseline: ${r.legacy} legacy systems × 2.5/mo = ${fmtNum(r.ticketsBaselineMonthly)}/month\nTickets after: ${r.legacy - r.decom} surviving × 2.5/mo × 60% = ${fmtNum(r.ticketsAfter)}/month (${r.ticketsReductionPct}% reduction)\nSAR turnaround: ${r.sarDaysBefore}d → ${r.sarDaysAfter}d (${r.sarReductionPct}% faster)`}
        source={"Ticket benchmarks: ITIL service desk reporting in NHS trusts (2.5 tickets/system/month for legacy clinical systems); surviving systems generate fewer tickets through consolidated support. SAR turnaround: the ICO requires searching every system where patient data may be held — 1.5 day base + 0.4 days per system, consistent with NHS information governance team reports and validated against a benchmarked Trust (42 systems ≈ 18 working days per SAR)."}
      />
    </Card>

    </div>

    {/* ═══ METHODOLOGY (animated Bento grid) ═══ */}
    <div style={{ marginBottom: 24 }}>
      <div style={{ fontSize: F.body, fontWeight: 700, color: C.textMid, marginBottom: 14, display: "flex", alignItems: "center", gap: 10 }}>
        <Icon name="lightbulb" size={22} stroke={C.accent} /> Full methodology
        <span style={{ fontSize: F.tiny, fontWeight: 400, color: C.textMuted, marginLeft: "auto" }}>Tap a tile to expand</span>
      </div>
      <MethodologyBento
        selectedIdx={methSelectedIdx}
        onSelect={setMethSelectedIdx}
        tiles={[
          { color: C.accent, title: "System costing", num: "01", body: <>Each legacy system is classified into three tiers with annual cost scaled by bed count and estate complexity: Enterprise (£300k base + £700/bed, e.g. a legacy PAS or EPR), Departmental (£75k + £160/bed), Standalone (£14k + £20/bed). The formulas were calibrated against the complete contract register of a large acute NHS Trust (~1,385 beds, 42 legacy systems, 2024/25 data) — defaults cover ~80% of actual estate value. Named flagship systems and "I know my spend" mode capture outlier contracts the generic formulas would miss.</> },
          { color: C.amber, title: "Clinical capacity", num: "02", body: <>Staffing uses 2.8 clinical FTEs per acute bed (NHS Digital workforce statistics 2023/24; Lord Carter review). Two evidence-based filters apply: 65% of staff are regular system users (Sinsky et al 2016; KLAS Arch Collaborative — 500k+ clinicians), and each user touches ~35% of the legacy estate. A 4% task-switching penalty per system (Bartek et al JIMI 2023, primary: 2.78M EHR audit-log events, β=0.03; corroborated by Westbrook et al JAMIA 2010 and Nuffield Trust 2020) determines minutes wasted. Hours freed are valued at £55/hr (NHS Agenda for Change mid-band with on-costs) with a 20-40% realisation rate (NHS Productive Ward), reflecting that freed time creates capacity, not automatic cash savings.</> },
          { color: C.purple, title: "Patient safety", num: "03", body: <>Harm rates come from Camacho et al 2024 (BMJ Quality & Safety): ~1.8M medication errors at care transitions across NHS England annually — 18 errors per bed/yr — with 31,500 patients harmed (0.315/bed) and 36,500 excess bed days (0.365/bed). A fragmentation index (0.6-1.2, capped at 20 systems) scales risk by the number of legacy systems, and your data quality setting adjusts it further. The error and patients-protected counts provide qualitative context; only the financial lines in the next tile enter the ROI total.</> },
          { color: C.rose, title: "Quality cost avoidance", num: "04", body: <>Three financial lines convert safety improvement into value: excess bed days avoided at £400/day (NHS Reference Costs, general acute, conservative blended); clinical negligence indemnity reduction (£7,500/bed exposure — NHS Resolution's £3.6bn annual settlements (NAO Oct 2025) across ~140k acute beds with 30% communication-failure attribution per CRICO 2016 — reduced 5%); and duplicate testing avoided (22 tests/bed/yr × 18% duplicate rate when records are fragmented (Bates et al) × £35/test NHS pathology blended). All are classified as cost avoidance: harm that doesn't occur, not direct budget reductions.</> },
          { color: "#2ecc71", title: "Confidence levels", num: "05", body: <>The Conservative / Moderate / Optimistic toggle on this report re-runs the whole model with a different multiplier set. Conservative: 85% of planned retirements land, 20% time realisation, 15% safety reduction. Moderate: 100% / 30% / 25%. Optimistic: 110% / 40% / 35%. The corridors come from NHS EPR programme consensus (decommission), NHS Productive Ward (realisation 20-40%) and Camacho et al 2024 / Gate et al 2023 (25-50% error reductions from consolidation). A benchmarked Trust's stated £16m/yr target fell between Conservative and Moderate — the corridor brackets real-world figures.</> },
          { color: "#8e44ad", title: "Real-world validation", num: "06", body: <>The model was validated against the complete application footprint of a large acute NHS Trust (~1,385 beds, dual-site merged estate): 42 unique systems (3 enterprise, 15 departmental, 24 standalone) with £16.75m/yr total contract value. Defaults alone reproduced £11.9m/yr (−26% vs the £16m target); with tier cost overrides or "I know my spend" mode the model landed within 2.5%. Four systems accounted for 78% of spend — exactly the pattern the named-flagship feature captures.</> },
          { color: C.accent, title: "Year-by-year ramp", num: "07", body: <>Savings are phased to reflect progressive legacy system retirement as data is migrated and interfaces are decommissioned. The 3-year view models 40% / 80% / 100% of steady state across Years 1-3. The 5-year view models 20% / 40% / 60% / 80% / 100% for a slower, more conservative cadence typical of larger Trusts and ICS-wide programmes. The top-of-page timescale toggle switches between these views and re-scales every figure on the report. Galen payback is calculated as migration cost ÷ (annual decommission savings minus annual archive cost).</> },
          { color: C.blue, title: "Key sources", num: "08", body: <>Camacho et al 2024, BMJ Quality & Safety (transition medication errors, harm, excess bed days) · National Audit Office Oct 2025 & NHS Resolution 2024/25 (clinical negligence) · NHS Digital workforce statistics 2023/24 · Lord Carter operational productivity review · NHS Employers Agenda for Change 2024/25 (£55/hr blended rate) · NHS Reference Costs (£400/bed-day, pathology) · Bartek et al JIMI 2023 & Westbrook et al JAMIA 2010 (system-switching cost) · Nuffield Trust 2020 (system navigation) · ICO guidance (SAR search obligations) · Benchmarked acute NHS Trust contract register (2024/25).</> },
        ]}
      />

    </div>

    {/* Actions */}
    <div style={{ display: "flex", gap: 16, justifyContent: "center", padding: "16px 0 24px" }}>

      }}>New case ↻</button>

  </div>;
}

/**
 * KpiCard - displays one large numeric KPI with label and sub-text.
 *
 * Accepts EITHER:
 *   - amount (numeric): rendered as <AnimK> so it animates on timescale change
 *   - value (any JSX/string): rendered as-is (for non-numeric KPIs like "X FTE freed")
 *
 * Why two props instead of just one? Rendering AnimK INSIDE KpiCard from a
 * plain numeric prop guarantees the same component instance persists across
 * renders, so useState/useRef in useCountUp keep the previous value and
 * animate to the new target instead of always resetting to 0. (JSX passed
 * via prop reconciles differently and loses that state.)
 * Same fix applied to CompositionItem below.
 */
function KpiCard({ label, amount, value, sub, color, iconKey, onClick }) {
  return <div onClick={onClick} style={{ padding: "24px 22px", background: C.surface, borderRadius: 18, border: `1px solid ${color}25`, cursor: "pointer", transition: "border-color .2s" }}>
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
      <Icon name={iconKey} size={26} stroke={color} />
      <span style={{ fontSize: F.tiny, fontWeight: 600, color: C.textMuted }}>{label}</span>
    </div>
    <div style={{ fontSize: F.h1, fontWeight: 800, color, marginBottom: 4 }}>
      {amount != null ? <AnimK value={amount} /> : value}
    </div>
    <div style={{ fontSize: F.tiny, color: C.textMid }}>{sub}</div>
    <div style={{ fontSize: 11, color: C.accent, fontWeight: 600, marginTop: 8 }}>View details ↓</div>
  </div>;
}

function CompositionItem({ color, dotColor, label, amount, pct }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
    <div style={{ width: 10, height: 10, borderRadius: 3, background: dotColor || color }} />
    <span style={{ fontSize: F.tiny, color: C.textMid }}>{label}: <strong style={{ color }}><AnimK value={amount} /></strong> ({pct}%)</span>
  </div>;
}

function CTitle({ iconKey, children, color }) {
  return <div style={{ fontSize: F.body, fontWeight: 700, color: C.textMid, marginBottom: 16, display: "flex", alignItems: "center", gap: 10 }}><Icon name={iconKey} size={24} stroke={color || C.accent} /> {children}</div>;
}
function Row({ label, value, accent }) {
  return <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: `1px solid ${C.border}` }}>
    <span style={{ fontSize: F.small, color: C.textMid }}>{label}</span>
    <span style={{ fontSize: F.body, fontWeight: accent ? 800 : 600, color: accent ? C.accent : C.text }}>{value}</span>
  </div>;
}
function Met({ label, value }) {
  return <div><div style={{ fontSize: F.tiny, color: C.textMuted }}>{label}</div><div style={{ fontSize: F.h2, fontWeight: 800, color: C.accent }}>{value}</div></div>;
}

/**
 * Animated Bento grid of 8 methodology tiles.
 *
 * Layout when tile X is selected:
 *
 *   ┌───────────────┬──────┐
 *   │               │ s[0] │
 *   │   LARGE (X)   ├──────┤
 *   │               │ s[1] │
 *   │               ├──────┤
 *   │               │ s[2] │
 *   ├──────┬────────┴──────┤
 *   │ s[3] │     s[4]      │
 *   ├──────┼───────────────┤
 *   │ s[5] │     s[6]      │
 *   └──────┴───────────────┘
 *
 * Each tile is absolutely positioned and receives a CSS transition on
 * top/left/width/height, so when the selection changes the tiles smoothly
 * resize and reflow into their new positions rather than swapping content
 * inside a static large slot. On phones (see .embed-bento styles) the grid
 * collapses to a vertical accordion instead.
 *
 * Slot conventions:
 *   slot === -1                  → tile is the LARGE one
 *   0..2 (right column top)      → 1st, 2nd, 3rd unselected tiles
 *   3..6 (bottom 2×2)            → 4th, 5th, 6th, 7th unselected tiles
 *                                  arranged top-left, top-right,
 *                                  bottom-left, bottom-right.
 */
function MethodologyBento({ tiles, selectedIdx, onSelect }) {
  const LARGE_H = 380;
  const BOTTOM_H = 240;
  const GAP = 14;
  const TOTAL_H = LARGE_H + GAP + BOTTOM_H;

  // Position style for a given slot. Uses % for horizontal so it adapts
  // to whatever width the parent container has; uses px for vertical
  // because the heights are fixed.
  const styleForSlot = (slot) => {
    if (slot === -1) {
      // LARGE: top-left of the top section, ~75% width, full top-section height.
      return { top: 0, left: 0, width: `calc(75% - ${GAP/2}px)`, height: LARGE_H };
    }
    if (slot >= 0 && slot <= 2) {
      // Right column of top section: 3 stacked tiles, 25% width.
      const slotH = (LARGE_H - 2 * GAP) / 3;
      return {
        top: slot * (slotH + GAP),
        left: `calc(75% + ${GAP/2}px)`,
        width: `calc(25% - ${GAP/2}px)`,
        height: slotH,
      };
    }
    // Bottom 2x2 grid: slots 3,4,5,6 → cells (0,0), (0,1), (1,0), (1,1).
    const idx = slot - 3;
    const row = Math.floor(idx / 2);
    const col = idx % 2;
    const slotH = (BOTTOM_H - GAP) / 2;
    return {
      top: LARGE_H + GAP + row * (slotH + GAP),
      left: col === 0 ? 0 : `calc(50% + ${GAP/2}px)`,
      width: `calc(50% - ${GAP/2}px)`,
      height: slotH,
    };
  };

  // Map every tile index to its slot for the current selection.
  // The selected tile is -1 (large); the others fill slots 0..6 in their
  // original-array order (so promotion is a swap with the previously-selected
  // tile's slot).
  const slotForTile = (tileIdx) => {
    if (tileIdx === selectedIdx) return -1;
    let nonSel = 0;
    for (let i = 0; i < tiles.length; i++) {
      if (i === selectedIdx) continue;
      if (i === tileIdx) return nonSel;
      nonSel++;
    }
    return 0;
  };

  // Smooth tile transition. Easing chosen for a natural settle (slight overshoot
  // is intentionally avoided so the layout stays predictable in dense reports).
  const TRANSITION = "top 0.45s cubic-bezier(0.65,0,0.25,1), left 0.45s cubic-bezier(0.65,0,0.25,1), width 0.45s cubic-bezier(0.65,0,0.25,1), height 0.45s cubic-bezier(0.65,0,0.25,1), border-color 0.3s ease, box-shadow 0.3s ease";

  return <div className="embed-bento" style={{ position: 'relative', width: '100%', height: TOTAL_H }}>
    {tiles.map((tile, idx) => {
      const slot = slotForTile(idx);
      const isLarge = slot === -1;
      const pos = styleForSlot(slot);
      return <div
        key={idx}
        className={'embed-bento-tile' + (isLarge ? ' embed-bento-large' : '')}
        onClick={isLarge ? undefined : () => onSelect(idx)}
        style={{
          position: 'absolute',
          ...pos,
          background: C.surface,
          borderRadius: isLarge ? 20 : 14,
          border: `${isLarge ? 2 : 1}px solid ${tile.color}${isLarge ? '55' : '30'}`,
          boxShadow: isLarge ? `0 0 0 1px ${tile.color}12, 0 8px 24px -8px ${tile.color}25` : 'none',
          cursor: isLarge ? 'default' : 'pointer',
          overflow: 'hidden',
          transition: TRANSITION,
          padding: isLarge ? "26px 28px" : "14px 16px",
          display: 'flex',
          flexDirection: 'column',
          gap: isLarge ? 12 : 6,
          boxSizing: 'border-box',
        }}
      >
        {/* Header (number badge + title) - always visible, scales between
            states. The badge and title use slightly different sizes for
            large vs small but the same structure so the DOM doesn't reshape. */}
        <div style={{ display: 'flex', alignItems: 'center', gap: isLarge ? 14 : 8, flexShrink: 0 }}>
          <span style={{
            width: isLarge ? 44 : 28,
            height: isLarge ? 44 : 28,
            borderRadius: '50%',
            background: tile.color + '20',
            color: tile.color,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            fontSize: isLarge ? F.small : 11,
            fontWeight: 800,
            flexShrink: 0,
            transition: 'width 0.45s, height 0.45s, font-size 0.45s',
          }}>{tile.num}</span>
          <span style={{
            fontSize: isLarge ? F.h3 : F.tiny,
            fontWeight: 700,
            color: tile.color,
            lineHeight: 1.2,
            transition: 'font-size 0.45s',
          }}>{tile.title}</span>
        </div>

        {/* Body — fades in only when the tile is large. Slight delay so the
            text appears once the tile has finished growing, avoiding cramped
            text mid-animation. */}
        <div className="embed-bento-body" style={{
          fontSize: F.small,
          color: C.textMid,
          lineHeight: 1.7,
          flex: 1,
          opacity: isLarge ? 1 : 0,
          transition: isLarge ? 'opacity 0.25s ease 0.2s' : 'opacity 0.15s ease',
          overflow: 'hidden',
          pointerEvents: isLarge ? 'auto' : 'none',
        }}>{tile.body}</div>

        {/* 'Tap to expand →' hint — only visible on small tiles. */}
        <div style={{
          fontSize: 11,
          color: C.textMuted,
          fontWeight: 600,
          alignSelf: 'flex-end',
          opacity: isLarge ? 0 : 1,
          transition: 'opacity 0.2s ease',
          flexShrink: 0,
        }}>Tap to expand →</div>
      </div>;
    })}
  </div>;
}

/* ═══ 12. APP — state machine, embed protocol, admin stats ════════════ */

/* ────────────────────────────────────────────────────────────────────────
   COMPLETION TRACKING + ADMIN STATS (localStorage-backed)
   Reveal: single tap on RLDatix logo on splash
   Reset: PIN-protected (default 2580 - vertical line on phone keypad)
   ──────────────────────────────────────────────────────────────────────── */
const STATS_KEY = 'kiosk-stats';
const ADMIN_PIN = '2580'; // 4-digit numeric. Change to your preferred PIN.

function recordCompletion(session) {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    const data = raw ? JSON.parse(raw) : { sessions: [], total: 0 };
    data.sessions.push({ ts: Date.now(), ...session });
    data.total = (data.total || 0) + 1;
    // Keep last 1000 sessions to bound storage growth
    if (data.sessions.length > 1000) data.sessions = data.sessions.slice(-1000);
    localStorage.setItem(STATS_KEY, JSON.stringify(data));
  } catch (e) { /* ignore */ }
}

function loadSessions() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (!raw) return { sessions: [], total: 0 };
    const data = JSON.parse(raw);
    // If the stored data isn't in the expected shape (e.g. an older format
    // from a previous build), wipe it. We don't migrate - this is throwaway
    // completion-counter data, not anything precious.
    if (!Array.isArray(data.sessions)) {
      localStorage.removeItem(STATS_KEY);
      return { sessions: [], total: 0 };
    }
    return { sessions: data.sessions, total: data.total || 0 };
  } catch (e) {
    try { localStorage.removeItem(STATS_KEY); } catch (e2) {}
    return { sessions: [], total: 0 };
  }
}

function resetStats() {
  try { localStorage.removeItem(STATS_KEY); } catch (e) { /* ignore */ }
}

// Compute aggregated stats: by organisation type + cumulative impact
function computeStats() {
  const { sessions, total } = loadSessions();
  const now = Date.now();
  const oneDayAgo = now - 24 * 60 * 60 * 1000;
  const today = sessions.filter(s => s.ts >= oneDayAgo).length;
  const last = sessions.length ? sessions[sessions.length - 1].ts : null;

  // Group by organisation type (the Scope-step preset key)
  const ORG_LABELS = {
    SMALL: 'Specialist / Smaller Trust',
    TYPICAL: 'Typical Acute Trust',
    LARGE: 'Large Acute Trust',
    REGIONAL: 'Integrated Care System / Multi-Trust',
  };
  const byProvider = {};
  for (const s of sessions) {
    const k = s.providerType || 'unknown';
    if (!byProvider[k]) byProvider[k] = { count: 0, beds: 0, systems: 0, savings: 0, fte: 0 };
    byProvider[k].count++;
    byProvider[k].beds += s.beds || 0;
    byProvider[k].systems += s.systems || 0;
    byProvider[k].savings += s.savings || 0;
    byProvider[k].fte += s.fte || 0;
  }
  const providerRows = Object.keys(byProvider).map(k => ({
    key: k,
    label: ORG_LABELS[k] || k,
    count: byProvider[k].count,
    avgBeds: Math.round(byProvider[k].beds / byProvider[k].count),
    avgSystems: Math.round(byProvider[k].systems / byProvider[k].count),
    avgSavings: Math.round(byProvider[k].savings / byProvider[k].count),
    avgFte: Math.round(byProvider[k].fte / byProvider[k].count * 10) / 10,
  })).sort((a, b) => b.count - a.count);

  // Cumulative impact across all sessions
  const cum = sessions.reduce((acc, s) => ({
    fte: acc.fte + (s.fte || 0),
    medErrors: acc.medErrors + (s.medErrors || 0),
    patients: acc.patients + (s.patientsProtected || 0),
    bedDays: acc.bedDays + (s.bedDays || 0),
    savings: acc.savings + (s.savings || 0),
  }), { fte: 0, medErrors: 0, patients: 0, bedDays: 0, savings: 0 });

  return { total, today, last, providerRows, cum };
}

/* ────────────────────────────────────────────────────────────────────────
   ADMIN STATS OVERLAY
   ──────────────────────────────────────────────────────────────────────── */
function fmtMoneyAdmin(n) {
  if (n >= 1e9) return '£' + (n/1e9).toFixed(1) + 'b';
  if (n >= 1e6) return '£' + (n/1e6).toFixed(1) + 'm';
  if (n >= 1e3) return '£' + Math.round(n/1e3) + 'k';
  return '£' + n;
}
function fmtNumAdmin(n) { return (n || 0).toLocaleString('en-GB'); }

function PinKeypad({ onSubmit, onCancel, error }) {
  const [pin, setPin] = useState('');
  const handleDigit = (d) => {
    if (pin.length < 4) {
      const next = pin + d;
      setPin(next);
      if (next.length === 4) {
        // Submit immediately on 4th digit
        setTimeout(() => onSubmit(next), 150);
      }
    }
  };
  const handleClear = () => setPin('');
  // Reset PIN when an error comes in (so user can retry)
  useEffect(() => { if (error) setPin(''); }, [error]);
  return (
    <div style={{ background: C.surface, padding: '36px 40px', borderRadius: 24, border: '1px solid ' + C.border, maxWidth: 420 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: C.amber, letterSpacing: 3, textTransform: 'uppercase', marginBottom: 8 }}>Restricted</div>
      <div style={{ fontSize: 22, fontWeight: 800, color: C.text, marginBottom: 6 }}>Enter PIN to reset stats</div>
      <div style={{ fontSize: 13, color: C.textMuted, marginBottom: 24 }}>Resetting stats cannot be undone.</div>
      <div style={{ display: 'flex', justifyContent: 'center', gap: 14, marginBottom: 22, height: 28 }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{
            width: 18, height: 18, borderRadius: '50%',
            background: i < pin.length ? C.accent : 'transparent',
            border: '2px solid ' + (i < pin.length ? C.accent : C.border),
            transition: 'all .15s'
          }} />
        ))}
      </div>
      {error && <div style={{ textAlign: 'center', fontSize: 13, color: C.rose, fontWeight: 600, marginBottom: 14 }}>Incorrect PIN. Try again.</div>}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 14 }}>
        {['1','2','3','4','5','6','7','8','9'].map(d => (
          <button key={d} onClick={() => handleDigit(d)} style={{
            padding: '20px 0', borderRadius: 14, border: '1px solid ' + C.border,
            background: C.bg, color: C.text, fontSize: 24, fontWeight: 700,
            cursor: 'pointer', fontFamily: 'inherit', transition: 'background .1s'
          }}>{d}</button>
        ))}
        <button onClick={handleClear} style={{
          padding: '20px 0', borderRadius: 14, border: '1px solid ' + C.border,
          background: C.bg, color: C.textMuted, fontSize: 14, fontWeight: 600,
          cursor: 'pointer', fontFamily: 'inherit'
        }}>Clear</button>
        <button onClick={() => handleDigit('0')} style={{
          padding: '20px 0', borderRadius: 14, border: '1px solid ' + C.border,
          background: C.bg, color: C.text, fontSize: 24, fontWeight: 700,
          cursor: 'pointer', fontFamily: 'inherit'
        }}>0</button>
        <button onClick={onCancel} style={{
          padding: '20px 0', borderRadius: 14, border: '1px solid ' + C.border,
          background: C.bg, color: C.textMuted, fontSize: 14, fontWeight: 600,
          cursor: 'pointer', fontFamily: 'inherit'
        }}>Cancel</button>
      </div>
    </div>
  );
}

function AdminOverlay({ onClose }) {
  const [stats, setStats] = useState(computeStats());
  const [pinOpen, setPinOpen] = useState(false);
  const [pinError, setPinError] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const refresh = () => setStats(computeStats());
  useEffect(() => {
    const id = setInterval(refresh, 1500);
    return () => clearInterval(id);
  }, []);
  const handlePinSubmit = (entered) => {
    if (entered === ADMIN_PIN) {
      setPinError(false);
      setPinOpen(false);
      setConfirmReset(true);
    } else {
      setPinError(true);
    }
  };
  const handleConfirmReset = () => { resetStats(); setConfirmReset(false); refresh(); };
  const lastStr = stats.last ? new Date(stats.last).toLocaleString() : 'never';

  return (
    <div style={{ position: 'fixed', inset: 0, background: C.scrim, zIndex: 99999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 40, overflow: 'auto' }}>
      {pinOpen ? (
        <PinKeypad onSubmit={handlePinSubmit} onCancel={() => { setPinOpen(false); setPinError(false); }} error={pinError} />

        <div style={{ background: C.surface, padding: '36px 40px', borderRadius: 24, border: '1px solid ' + C.rose, maxWidth: 480 }}>

          <div style={{ display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
            <button onClick={() => setConfirmReset(false)} style={{ padding: '12px 22px', borderRadius: 12, border: '1px solid ' + C.border, background: 'transparent', color: C.textMid, fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Cancel</button>

          </div>
        </div>

      <div style={{ background: C.surface, padding: '36px 40px', borderRadius: 24, border: '1px solid ' + C.border, width: '100%', maxWidth: 720 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 22 }}>
          <div>
            <div style={{ fontSize: 12, fontWeight: 700, color: C.accent, letterSpacing: 3, textTransform: 'uppercase' }}>Completion Stats</div>
            <div style={{ fontSize: 26, fontWeight: 800, color: C.text, marginTop: 4 }}>Assessments completed</div>
          </div>
          <button onClick={onClose} style={{ padding: '10px 22px', borderRadius: 10, border: 'none', background: C.accent, color: C.onAccent, fontSize: 13, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>Close</button>
        </div>

        {/* Top row: total + 24h */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 18 }}>
          <div style={{ padding: '18px 20px', background: C.bg, borderRadius: 14, border: '1px solid ' + C.borderLight }}>
            <div style={{ fontSize: 11, color: C.textMuted, textTransform: 'uppercase', letterSpacing: 1.5, fontWeight: 600 }}>All time</div>
            <div style={{ fontSize: 44, fontWeight: 800, color: C.accent, lineHeight: 1.1, marginTop: 4 }}>{stats.total}</div>
          </div>
          <div style={{ padding: '18px 20px', background: C.bg, borderRadius: 14, border: '1px solid ' + C.borderLight }}>
            <div style={{ fontSize: 11, color: C.textMuted, textTransform: 'uppercase', letterSpacing: 1.5, fontWeight: 600 }}>Last 24 hours</div>
            <div style={{ fontSize: 44, fontWeight: 800, color: C.accent, lineHeight: 1.1, marginTop: 4 }}>{stats.today}</div>
          </div>
        </div>

        {/* By organisation type */}
        {stats.providerRows.length > 0 && <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11, color: C.textMuted, textTransform: 'uppercase', letterSpacing: 1.5, fontWeight: 600, marginBottom: 10 }}>By organisation type</div>
          <div style={{ background: C.bg, borderRadius: 14, border: '1px solid ' + C.borderLight, overflow: 'hidden' }}>

              <div>Type</div>

              <div style={{ textAlign: 'right' }}>Avg beds</div>

              <div style={{ textAlign: 'right' }}>Avg FTE</div>
            </div>
            {stats.providerRows.map(r => (
              <div key={r.key} style={{ display: 'grid', gridTemplateColumns: '2fr 0.6fr 0.7fr 0.7fr 0.9fr 0.7fr', gap: 8, padding: '12px 16px', borderBottom: '1px solid ' + C.borderLight, fontSize: 13 }}>

                <div style={{ textAlign: 'right', color: C.textMid }}>{r.avgFte}</div>
              </div>
            ))}
          </div>
        </div>}

        {/* Cumulative impact */}
        {stats.total > 0 && <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 11, color: C.textMuted, textTransform: 'uppercase', letterSpacing: 1.5, fontWeight: 600, marginBottom: 10 }}>Cumulative impact across all sessions</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
            <div style={{ padding: '14px 16px', background: C.bg, borderRadius: 12, border: '1px solid ' + C.borderLight }}>
              <div style={{ fontSize: 11, color: C.textMuted }}>Total annual savings shown</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: C.accent, marginTop: 4 }}>{fmtMoneyAdmin(stats.cum.savings)}</div>
            </div>
            <div style={{ padding: '14px 16px', background: C.bg, borderRadius: 12, border: '1px solid ' + C.borderLight }}>
              <div style={{ fontSize: 11, color: C.textMuted }}>FTEs freed (cumulative)</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: C.amber, marginTop: 4 }}>{fmtNumAdmin(Math.round(stats.cum.fte))}</div>
            </div>
            <div style={{ padding: '14px 16px', background: C.bg, borderRadius: 12, border: '1px solid ' + C.borderLight }}>
              <div style={{ fontSize: 11, color: C.textMuted }}>Patients protected</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: C.purple, marginTop: 4 }}>{fmtNumAdmin(stats.cum.patients)}</div>
            </div>
            <div style={{ padding: '14px 16px', background: C.bg, borderRadius: 12, border: '1px solid ' + C.borderLight }}>
              <div style={{ fontSize: 11, color: C.textMuted }}>Med errors avoided</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: C.purple, marginTop: 4 }}>{fmtNumAdmin(stats.cum.medErrors)}</div>
            </div>
            <div style={{ padding: '14px 16px', background: C.bg, borderRadius: 12, border: '1px solid ' + C.borderLight }}>
              <div style={{ fontSize: 11, color: C.textMuted }}>Excess bed days avoided</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: C.blue, marginTop: 4 }}>{fmtNumAdmin(stats.cum.bedDays)}</div>
            </div>
            <div style={{ padding: '14px 16px', background: C.bg, borderRadius: 12, border: '1px solid ' + C.borderLight }}>
              <div style={{ fontSize: 11, color: C.textMuted }}>Last completion</div>
              <div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginTop: 8, lineHeight: 1.4 }}>{lastStr}</div>
            </div>
          </div>
        </div>}

        {stats.total === 0 && <div style={{ padding: '24px', background: C.bg, borderRadius: 12, border: '1px solid ' + C.borderLight, textAlign: 'center', color: C.textMuted, fontSize: 14, marginBottom: 18 }}>
          No sessions recorded yet.
        </div>}

        <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
          <button onClick={() => setPinOpen(true)} disabled={stats.total === 0} style={{ padding: '10px 18px', borderRadius: 10, border: '1px solid ' + C.border, background: 'transparent', color: stats.total === 0 ? C.textMuted : C.textMid, fontSize: 12, fontWeight: 600, cursor: stats.total === 0 ? 'default' : 'pointer', fontFamily: 'inherit', opacity: stats.total === 0 ? 0.4 : 1 }}>Reset stats (PIN required)</button>
        </div>
      </div>
      )}
    </div>
  );
}

/**
 * Timescale + confidence selector for the results report.
 *
 * Rendered at App level, OUTSIDE the scroll container that holds the report
 * content, so it's always visible at the top of the report screen
 * regardless of scroll position (position:sticky inside ResultsPage doesn't
 * work because of the transform-based animations in PageTransition and
 * ResultsPage's outer wrapper).
 */
function TimescaleBar({ viewTimescale, setViewTimescale, scenarioMode, setScenarioMode }) {
  return <div className="embed-timescale" style={{
    padding: "14px 56px 16px",
    borderBottom: `1px solid ${C.borderLight}`,
    background: C.bg,
    boxShadow: `0 4px 12px -4px rgba(0,0,0,0.5)`,
    // Sticky relative to the nearest scrolling ancestor — the body scrolls,
    // so the bar pins to the viewport (offset by the sticky header height
    // via .embed-timescale). No transform-using animated ancestors above
    // this point, so sticky resolves correctly.
    position: 'sticky',
    top: 0,
    zIndex: 20,
  }}>
    <div style={{ fontSize: F.tiny, fontWeight: 600, color: C.textMuted, letterSpacing: 2, textTransform: "uppercase", textAlign: "center", marginBottom: 8 }}>View savings as:</div>
    <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
      {[
        { k: 'year1',  label: 'Year 1' },
        { k: 'total3', label: '3-yr total' },
        { k: 'total5', label: '5-yr total' },
        { k: 'annual', label: 'Annual avg' },
      ].map(opt => {
        const active = viewTimescale === opt.k;
        return <button key={opt.k} onClick={() => setViewTimescale(opt.k)} style={{
          padding: "12px 22px", borderRadius: 12, fontSize: F.small, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
          border: active ? `2px solid ${C.accent}` : `1px solid ${C.border}`,
          background: active ? C.accent : C.surface,

          transition: "all .15s",
          minWidth: 120,
        }}>{opt.label}</button>;
      })}
    </div>
    {scenarioMode != null && <>
      <div style={{ fontSize: F.tiny, fontWeight: 600, color: C.textMuted, letterSpacing: 2, textTransform: "uppercase", textAlign: "center", margin: "10px 0 8px" }}>Confidence level:</div>
      <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
        {[
          { k: 'CONSERVATIVE', label: 'Conservative' },
          { k: 'EXPECTED', label: 'Moderate' },
          { k: 'STRETCH', label: 'Optimistic' },
        ].map(opt => {
          const active = scenarioMode === opt.k;
          return <button key={opt.k} onClick={() => setScenarioMode(opt.k)} style={{
            padding: "12px 22px", borderRadius: 12, fontSize: F.small, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
            border: active ? `2px solid ${C.accent}` : `1px solid ${C.border}`,
            background: active ? C.accent : C.surface,
            color: active ? C.onAccent : C.textMid,
            transition: "all .15s",
            minWidth: 120,
          }}>{opt.label}</button>;
        })}
      </div>
    </>}
  </div>;
}

/**
 * Global responsive overrides.
 *
 * The layout values in the components are the desktop max; these media
 * queries dial them down on smaller viewports. A CSS-in-style-tag because
 * React inline styles can't express media queries (no @-rules).
 *
 * Breakpoints:
 *   <= 640px  : phone portrait. Single-column grids, tightened padding,
 *               smaller bar buttons, stacked composition strip.
 *   <= 900px  : phone landscape / small tablet. Single-column KPI grid.
 *   > 900px   : desktop - the full layout.
 *
 * Selectors target classes set in the components (.embed-header-pad,
 * .embed-scroll-area, …) so the responsive behaviour can't accidentally
 * bleed into anything else.
 */
function EmbedStyles() {
  return <style>{`
    /* The embed scrolls like a normal web page. The app's outer container
       only sets a MINIMUM height; body-level scrolling also makes
       position:sticky (header, step title, timescale bar) work as designed. */
    html, body { margin: 0; padding: 0; }
    #root { width: 100%; min-height: 100vh; }

    /* CRITICAL for the sticky elements below: the inner scroll container's
       overflow:auto would capture position:sticky descendants into a scroll
       box that never actually scrolls (the body scrolls instead), so sticky
       would never engage. Neutralise it. */
    .embed-scroll-area { overflow: visible !important; }

    /* Sticky progress header. Fluid gutter so the pinned bar doesn't eat
       vertical space; the StepIndicator's own margin-bottom is cancelled so
       the header's background wraps it exactly. */
    .embed-header-pad {
      position: sticky; top: 0; z-index: 30;
      background: ${C.bg};
      padding: 12px clamp(16px, 4vw, 44px) 10px !important;
      box-shadow: 0 4px 14px -10px rgba(15,65,70,0.4);
    }
    .embed-header-pad > div { margin-bottom: 0 !important; }

    /* Content column: same fluid gutter. */
    .embed-scroll-area { padding: 0 clamp(16px, 4vw, 44px) 12px !important; }

    /* Step title sticks just below the header. --embed-header-h is measured
       at runtime (see App's header ResizeObserver) because the header's
       height varies with breakpoint and label wrapping. */
    .embed-step-title {
      position: sticky; top: var(--embed-header-h, 74px); z-index: 25;
      background: ${C.bg};
      padding: 8px 0 10px;
      margin-bottom: 18px !important;
    }

    /* Results timescale bar: pin below the sticky header instead of top:0,
       web-scale padding, and a soft shadow for the light theme. */
    .embed-timescale {
      top: var(--embed-header-h, 74px) !important;
      z-index: 25;
      padding: 10px clamp(16px, 4vw, 44px) 12px !important;
      box-shadow: 0 4px 12px -4px rgba(15,65,70,0.18) !important;
    }
    /* Constant border width on the timescale buttons: the active button's
       2px-vs-1px border made every button grow/shrink as the selection
       moved, and because the bar is sticky the whole page shivered by 2px
       on each switch. Border colour still shows the selection. */
    .embed-timescale button { border-width: 2px !important; padding: 9px 18px !important; min-width: 0 !important; }

    /* Composition legend: structurally stable at EVERY width. As the
       count-up animation runs, item widths change; with centered flex-wrap
       the last item hopped between one and two lines mid-animation and
       bounced the whole report. A 2-column grid has a row count that
       depends only on the item count, never on the animating text widths,
       and tabular figures keep digit widths constant while counting. */
    .embed-comp-legend {
      font-variant-numeric: tabular-nums;
      display: grid !important;
      grid-template-columns: repeat(2, auto);
      justify-items: start;
      column-gap: 40px !important;
      row-gap: 8px !important;
    }

    /* Nav row: allow wrapping so the primary button can never overflow the
       viewport edge. */
    .embed-nav-row { flex-wrap: wrap; }

    /* Phone landscape / small tablet: single column KPI */
    @media (max-width: 900px) {
      /* Collapse 2-col grids to single column. The KpiCard grid uses inline
         gridTemplateColumns: "1fr 1fr" - overriding the inline style
         requires the more specific selector + !important. */
      .embed-scroll-area [style*="gridTemplateColumns: \\"1fr 1fr\\""],
      .embed-scroll-area [style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }
    }

    /* Phone portrait: compact nav structure. */
    @media (max-width: 640px) {
      .embed-nav-row { gap: 8px !important; justify-content: space-between; }
      .embed-nav-row button { padding: 13px 18px !important; }
      /* The primary action (Next / Calculate ROI) gets its own full-width
         row - a proper thumb target - instead of wrapping raggedly when the
         three buttons don't fit side by side. The flex-spacer divs between
         the buttons are dropped so Back and Start over split the first row. */
      .embed-nav-row > div { display: none; }
      .embed-nav-row > button:last-child { flex: 1 1 100%; margin-top: 2px; }

      /* Compact the sticky timescale bar further on phones. */
      .embed-timescale button { padding: 8px 12px !important; }

      /* Methodology bento: the 75/25 absolutely-positioned grid cannot work
         at phone width (right-column tiles become unreadable slivers and the
         large tile clips its text). Collapse to a vertical accordion: every
         tile full-width and auto-height, selected tile shows its body,
         unselected tiles are just their tappable header row. */
      .embed-bento { height: auto !important; display: flex; flex-direction: column; gap: 12px; }
      .embed-bento-tile { position: static !important; width: 100% !important; height: auto !important; }
      .embed-bento-tile:not(.embed-bento-large) .embed-bento-body { display: none; }

      /* Report stability on timescale switches: the longest eyebrow label
         ("Estimated 3-year cumulative savings") wrapped to a second line at
         phone width, so the whole report jumped ~23px on every switch.
         Sized to keep every label variant on one line. */
      .embed-hero-eyebrow { font-size: 12px !important; letter-spacing: 2px !important; }

      /* Narrow screens: equal-width columns so long items can't push the
         pair off-center. */
      .embed-comp-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px !important; }
    }

    /* Very narrow phones: keep the eyebrow on one line. */
    @media (max-width: 374px) {
      .embed-hero-eyebrow { font-size: 10.5px !important; letter-spacing: 1.5px !important; }
    }
  `}</style>;
}

function CalibratingScreen({ onDone }) {
  const [step, setStep] = useState(0);
  const [barW, setBarW] = useState(0);
  const steps = ['Mapping your legacy estate', 'Modelling decommission savings', 'Estimating clinical capacity impact', 'Valuing quality & safety improvements'];
  useEffect(() => {
    const t = [
      setTimeout(() => { setStep(1); setBarW(25); }, 600),
      setTimeout(() => { setStep(2); setBarW(50); }, 1400),
      setTimeout(() => { setStep(3); setBarW(75); }, 2200),
      setTimeout(() => setBarW(100), 2800),
      setTimeout(onDone, 3200),
    ];
    return () => t.forEach(clearTimeout);
  }, [onDone]);

  return (
    <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
      <style>{`
        @keyframes calSpin { to { transform: rotate(360deg); } }
        @keyframes calPulse { 0%,100% { opacity:.5; transform:scale(1); } 50% { opacity:1; transform:scale(1.02); } }
      `}</style>
      <div style={{ position: 'relative', width: 100, height: 100, marginBottom: 48 }}>
        <div style={{ position: 'absolute', inset: 0, border: '4px solid ' + C.border, borderRadius: '50%' }} />
        <div style={{ position: 'absolute', inset: 0, border: '4px solid transparent', borderTopColor: C.accent, borderRightColor: C.accent, borderRadius: '50%', animation: 'calSpin .8s linear infinite' }} />
        <div style={{ position: 'absolute', inset: 16, border: '3px solid transparent', borderTopColor: C.tealLight, borderRadius: '50%', animation: 'calSpin 1.4s linear infinite reverse' }} />
      </div>
      <div style={{ fontSize: F.h1, fontWeight: 800, color: C.accent, marginBottom: 12, animation: 'calPulse 2s ease-in-out infinite', textAlign: 'center' }}>Calibrating your model</div>
      <div style={{ fontSize: F.body, color: C.textMuted, marginBottom: 44, textAlign: 'center' }}>{'Analysing ' + (step < 2 ? 'inputs' : 'clinical impact') + '...'}</div>
      <div style={{ width: 420, maxWidth: '80%', height: 6, background: C.border, borderRadius: 3, marginBottom: 40, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: barW + '%', background: 'linear-gradient(90deg, ' + C.accent + ', ' + C.tealLight + ')', borderRadius: 3, transition: 'width .5s ease-out' }} />
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16, width: 420, maxWidth: '80%' }}>
        {steps.map((label, i) => {
          const done = step > i, active = step === i;
          return (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 16, opacity: done ? 1 : active ? 0.9 : 0.2, transform: done || active ? 'translateX(0)' : 'translateX(-8px)', transition: 'all .4s cubic-bezier(0.16, 1, 0.3, 1)' }}>
              <div style={{ width: 32, height: 32, borderRadius: '50%', flexShrink: 0, background: done ? C.accent : active ? C.accent + '30' : C.border, border: active ? '2px solid ' + C.accent : '2px solid transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all .3s' }}>
                {done && <span style={{ color: C.onAccent, fontSize: 18, fontWeight: 800 }}>{'✓'}</span>}
                {active && <div style={{ width: 8, height: 8, borderRadius: 4, background: C.accent }} />}
              </div>
              <span style={{ fontSize: F.body, fontWeight: active ? 700 : 400, color: done ? C.accent : active ? C.text : C.textMuted, transition: 'all .3s' }}>{label}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [showSplash, setShowSplash] = useState(true);
  // #admin-leads reviews locally stored lead-form submissions. Hash-driven,
  // no UI affordance.
  const [adminLeads, setAdminLeads] = useState(typeof window !== 'undefined' && window.location.hash === '#admin-leads');
  const embedHeaderRef = useRef(null); // sticky header height source (see --embed-header-h)
  const [kioskStep, setKioskStep] = useState(0);
  const [calibrating, setCalibrating] = useState(false);
  const [adminVisible, setAdminVisible] = useState(false);
  // Timescale view for the report. Lifted up here (out of ResultsPage) so the
  // toggle bar can be rendered OUTSIDE the scroll container — with the bar at
  // App level it's always visible at the top of the results screen regardless
  // of how far the user has scrolled the report.
  const [viewTimescale, setViewTimescale] = useState('annual');
  const [orgType, setOrgType] = useState("TYPICAL");            // Scope selection
  const [scenarioMode, setScenarioMode] = useState("EXPECTED"); // on-screen confidence toggle
  const [galenMigrationCost, setGalenMigrationCost] = useState(0);
  const [galenAnnualCost, setGalenAnnualCost] = useState(0);
  const [flagships, setFlagships] = useState([]);
  const [costMode, setCostMode] = useState("estimate");
  const [knownSpend, setKnownSpend] = useState(0);
  const [inputs, setInputs] = useState({ ...PRESETS.TYPICAL.data, tiers: { ...PRESETS.TYPICAL.data.tiers } });

  const update = useCallback((key, val) => setInputs(p => ({ ...p, [key]: val })), []);
  const updateTier = useCallback((tier, val) => setInputs(p => ({ ...p, tiers: { ...p.tiers, [tier]: val } })), []);
  const applyPreset = useCallback((key) => { const p = PRESETS[key]; if (!p) return; setInputs({ ...p.data, tiers: { ...p.data.tiers } }); setFlagships([]); }, []);
  const selectOrgType = useCallback((key) => { setOrgType(key); applyPreset(key); }, [applyPreset]);

  const addFlagship = useCallback((sys, tier) => {
    const cost = sys.baseCost ? systemCost(sys, inputs.bed_count) : (sys.cost || 250000);
    setFlagships(p => [...p, { name: sys.label || "", cost, retire: true, tier: tier || null, instances: 1 }]);
  }, [inputs.bed_count]);

  const removeFlagship = useCallback((idx) => {
    setFlagships(p => p.filter((_, j) => j !== idx));
  }, []);
  const updateFlagshipCost = useCallback((idx, cost) => {
    setFlagships(p => p.map((f, i) => i === idx ? { ...f, cost: Math.max(0, cost) } : f));
  }, []);
  // Clamp instances to [1, 99]. An ICS with 4 Trusts running the same PAS
  // is a real case; 99 is a generous upper bound.
  const updateFlagshipInstances = useCallback((idx, instances) => {
    setFlagships(p => p.map((f, i) => i === idx ? { ...f, instances: Math.max(1, Math.min(99, instances)) } : f));
  }, []);

  const calcInputs = useMemo(() => {
    return { ...inputs, _knownSpend: costMode === "known" && knownSpend > 0 ? knownSpend : 0 };
  }, [inputs, costMode, knownSpend]);

  const r = useMemo(() => calc(calcInputs, scenarioMode, {}, flagships), [calcInputs, flagships, scenarioMode]);

  const handleCalculate = useCallback(() => setCalibrating(true), []);
  const handleCalibrationDone = useCallback(() => {
    setCalibrating(false);
    setKioskStep(KIOSK_STEPS.length - 1);
    // Capture session metadata so the admin overlay can break stats down by
    // organisation type and report cumulative impact across all assessments.
    recordCompletion({
      providerType: orgType,
      beds: inputs.bed_count,
      orgs: inputs.org_count,
      systems: r.legacy || 0,
      decomSystems: r.decom || 0,
      savings: r.annualWithReimbursement || r.annual || 0,
      fte: r.fteEquivalent || 0,
      medErrors: r.safetyMedErrorsAvoided || 0,
      patientsProtected: r.safetyPatientsProtected || 0,
      bedDays: r.safetyBedDaysAvoided || 0,
      decomSave: r.decomSave || 0,
      timeSave: r.timeSave || 0,
    });
  }, [orgType, inputs, r]);
  const handleAdjust = useCallback(() => setKioskStep(4), []);
  const handleStartOver = useCallback(() => {
    setShowSplash(true);
    setKioskStep(0);
    setOrgType("TYPICAL");
    setScenarioMode("EXPECTED");
    setGalenMigrationCost(0);
    setGalenAnnualCost(0);
    setFlagships([]);
    setCostMode("estimate");
    setKnownSpend(0);
    setInputs({ ...PRESETS.TYPICAL.data, tiers: { ...PRESETS.TYPICAL.data.tiers } });
  }, []);

  const renderStep = () => {
    switch (kioskStep) {
      case 0: return <OrgTypeStep orgType={orgType} onSelect={selectOrgType} />;
      case 1: return <JourneyStep journey={inputs.journey} onSelect={v => update("journey", v)} />;
      case 2: return <ScaleStep inputs={inputs} update={update} />;
      case 3: return <SystemsStep inputs={inputs} updateTier={updateTier} flagships={flagships} addFlagship={addFlagship} removeFlagship={removeFlagship} updateFlagshipCost={updateFlagshipCost} updateFlagshipInstances={updateFlagshipInstances} costMode={costMode} setCostMode={setCostMode} knownSpend={knownSpend} setKnownSpend={setKnownSpend} />;
      case 4: return <FineTuneStep inputs={inputs} update={update} galenMigrationCost={galenMigrationCost} setGalenMigrationCost={setGalenMigrationCost} galenAnnualCost={galenAnnualCost} setGalenAnnualCost={setGalenAnnualCost} />;
      case 5: return <ResultsPage r={r} galenMigrationCost={galenMigrationCost} galenAnnualCost={galenAnnualCost} viewTimescale={viewTimescale} setViewTimescale={setViewTimescale} onAdjust={handleAdjust} onStartOver={handleStartOver} leadContext={{ orgType, beds: inputs.bed_count, orgs: inputs.org_count, journey: inputs.journey, scenarioMode, calcInputs, flagships }} />;
      default: return null;
    }
  };

  useEffect(() => {
    const onHash = () => setAdminLeads(window.location.hash === '#admin-leads');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // The page scrolls at body level, so jump back to the top when the step
  // changes — otherwise tapping Next leaves the user mid-page on the next
  // step. When framed, also tell the host page to scroll the iframe back
  // into view — in auto-resize mode the iframe is full-height, so only the
  // PARENT page can perform this scroll.
  useEffect(() => {
    // Scroll back to the top of the CALCULATOR, not the document: identical
    // on the standalone page (the app starts at the top), but on a WordPress
    // inline embed it returns to the calculator rather than the site header.
    const mount = document.getElementById('galen-roi-root') || document.getElementById('root');
    if (mount) mount.scrollIntoView({ behavior: 'auto', block: 'start' });
    else window.scrollTo({ top: 0, behavior: 'auto' });
    if (window.parent !== window) {
      try { window.parent.postMessage({ type: 'roi-calculator-scroll-top' }, '*'); } catch (e) { /* ignore */ }
    }
  }, [kioskStep, calibrating, showSplash]);

  // Iframed: report the content height to the host page so its iframe can
  // auto-size (same postMessage contract as the full web calculators:
  // roi-calculator-resize { height }). Harmless when not framed or when the
  // host doesn't listen.
  useEffect(() => {
    if (typeof window === 'undefined' || window.parent === window) return;
    let raf = 0;
    const post = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        try {
          const h = Math.max(document.documentElement.scrollHeight, document.body ? document.body.scrollHeight : 0);
          window.parent.postMessage({ type: 'roi-calculator-resize', height: h }, '*');
        } catch (e) { /* ignore */ }
      });
    };
    post();
    const ro = new ResizeObserver(post);
    ro.observe(document.documentElement);
    if (document.body) ro.observe(document.body);
    window.addEventListener('load', post);
    return () => { cancelAnimationFrame(raf); ro.disconnect(); window.removeEventListener('load', post); };
  }, []);

  // Publish the sticky header's height as a CSS variable so the sticky step
  // title / timescale bar can pin themselves just below it. Measured (not
  // hardcoded) because the header's height changes with breakpoint padding
  // and step-label wrapping on narrow screens.
  useEffect(() => {
    if (showSplash) return;
    const el = embedHeaderRef.current;
    if (!el) return;
    const publish = () => {
      document.documentElement.style.setProperty('--embed-header-h', el.offsetHeight + 'px');
    };
    publish();
    const ro = new ResizeObserver(publish);
    ro.observe(el);
    return () => ro.disconnect();
  }, [showSplash, calibrating]);

  if (adminLeads) {
    return <div style={{ fontFamily: "'DM Sans', sans-serif", background: C.bg, minHeight: '100vh', color: C.text }}>
      <AdminLeads onClose={() => { window.location.hash = ''; }} />
    </div>;
  }

  if (showSplash) return <>
    <SplashScreen onStart={() => setShowSplash(false)} onAdminReveal={() => setAdminVisible(true)} />
    {adminVisible && <AdminOverlay onClose={() => setAdminVisible(false)} />}
  </>;

  if (calibrating) {
    return <div style={{ fontFamily: "'DM Sans', sans-serif", background: C.bg, width: "100%", maxWidth: MAXW, margin: "0 auto", minHeight: "100vh", color: C.text, position: "relative", zIndex: 0 }}>
      <EmbedStyles />
      <CalibratingScreen onDone={handleCalibrationDone} />
      {adminVisible && <AdminOverlay onClose={() => setAdminVisible(false)} />}
    </div>;
  }

  return (
    <div style={{ fontFamily: "'DM Sans', sans-serif", background: C.bg, width: "100%", maxWidth: MAXW, margin: "0 auto", minHeight: "100vh", color: C.text, lineHeight: 1.55, display: "flex", flexDirection: "column", position: "relative", zIndex: 0 }}>
      <EmbedStyles />
      <div ref={embedHeaderRef} className="embed-header-pad" style={{ padding: "48px 56px 0" }}>
        <StepIndicator steps={KIOSK_STEPS} current={kioskStep} onJump={setKioskStep} />
      </div>
      {/* Timescale bar — rendered here (above the scroll container) instead
          of inside ResultsPage so it stays visible no matter how far the
          user scrolls. Only renders on the report screen (kioskStep === 5). */}
      {kioskStep === 5 && <TimescaleBar viewTimescale={viewTimescale} setViewTimescale={setViewTimescale} scenarioMode={scenarioMode} setScenarioMode={setScenarioMode} />}
      <div className="embed-scroll-area" style={{ flex: 1, overflowY: "auto", padding: "0 56px 32px" }}>
        <PageTransition step={kioskStep}>{renderStep()}</PageTransition>
      </div>
      <NavButtons step={kioskStep} totalSteps={KIOSK_STEPS.length} onBack={() => setKioskStep(p => p - 1)} onNext={() => setKioskStep(p => p + 1)} onCalculate={handleCalculate} onStartOver={handleStartOver} />
      {adminVisible && <AdminOverlay onClose={() => setAdminVisible(false)} />}
    </div>
  );
}

// The WordPress inline fragments mount to #galen-roi-root (a unique id that
// can't collide with host-page themes); the standalone page keeps #root.
ReactDOM.createRoot(document.getElementById('galen-roi-root') || document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
