# Netlify deploy for the UK & Ireland touchscreen kiosk.
# In Netlify: Add new site > Import from Git > this repo, and set
# Base directory to rld-galen-uki-touchscreen-oct-2026. Everything else
# comes from this file. Netlify clones the whole repo, so ../kiosk-app
# is available to the build (same build script as the Vercel project).
[build]
  base = "rld-galen-uki-touchscreen-oct-2026"
  command = "npm run build"
  publish = "dist"
  # Skip the build when neither this folder nor the app source changed,
  # so pushes for the other calculators don't use build minutes.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../kiosk-app"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
